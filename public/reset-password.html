<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset password · SANKI Business OS</title>
  <style>
    :root{--blue:#185FA5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#1a1a1a}.card{width:100%;max-width:380px;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:34px 30px 28px;margin:20px}h1{font-size:22px;margin:0 0 5px;text-align:center}p{font-size:13px;color:#6b7280;text-align:center}label{display:block;font-size:12px;font-weight:600;color:#374151;margin:14px 0 5px}input{width:100%;padding:11px 12px;font-size:14px;border:1px solid #d1d5db;border-radius:8px}button{width:100%;margin-top:20px;padding:12px;font-size:14px;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}.err{color:#b42318}.ok{color:#047857}a{display:block;text-align:center;margin-top:14px;color:var(--blue);font-size:13px}
  </style>
</head>
<body><main class="card"><h1>Reset owner password</h1><p>Choose a new password for gaganlambasanki.</p>
  <form id="form"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required />
  <label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
  <button id="submit" type="submit">Reset password and sign in</button><div id="msg" class="msg"></div></form><a href="/login.html">Back to sign in</a>
  <script>
    var form=document.getElementById('form'),msg=document.getElementById('msg'),button=document.getElementById('submit');
    var token=(location.hash||'').replace(/^#token=/,'');
    if(!token){msg.textContent='Open the private reset link provided to you.';msg.className='msg err';button.disabled=true;}
    form.addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8){msg.textContent='Use at least 8 characters.';msg.className='msg err';return;}if(p!==c){msg.textContent='The passwords do not match.';msg.className='msg err';return;}button.disabled=true;msg.textContent='Resetting…';fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:p})}).then(function(r){return r.json();}).then(function(d){if(!d.success)throw new Error(d.error||'Reset failed.');history.replaceState(null,'','/reset-password.html');msg.textContent='Password reset. Signing you in…';msg.className='msg ok';location.href=d.home||'/dashboard.html';}).catch(function(err){button.disabled=false;msg.textContent=err.message;msg.className='msg err';});});
  </script>
</main></body></html>
