<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Users &amp; Roles · SANKI Business OS</title>
  <style>
    :root { --blue:#185FA5; }
    * { box-sizing: border-box; }
    body {
      margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#f6f7f9; color:#1a1a1a;
    }
    .wrap { max-width:900px; margin:0 auto; padding:26px 22px 60px; }
    h1 { font-size:22px; margin:0 0 4px; font-weight:800; }
    .sub { color:#6b7280; font-size:13px; margin:0 0 22px; }
    .card {
      background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:12px;
      padding:20px; margin-bottom:22px;
    }
    .card h2 { font-size:15px; margin:0 0 14px; font-weight:700; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
    .field { flex:1 1 150px; min-width:130px; }
    label { display:block; font-size:11px; font-weight:600; color:#374151; margin-bottom:4px; }
    input, select {
      width:100%; padding:9px 10px; font-size:13px; border:1px solid #d1d5db;
      border-radius:7px; outline:none; background:#fff;
    }
    input:focus, select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(24,95,165,.13); }
    button {
      padding:9px 16px; font-size:13px; font-weight:600; color:#fff; background:var(--blue);
      border:none; border-radius:7px; cursor:pointer; white-space:nowrap;
    }
    button:hover { background:#134d86; }
    button.ghost { background:#fff; color:#374151; border:1px solid #d1d5db; }
    button.ghost:hover { background:#f3f4f6; }
    button.danger { background:#fff; color:#b42318; border:1px solid #f0c2bd; }
    button.danger:hover { background:#fef2f1; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #eef0f2; vertical-align:middle; }
    th { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:#9ca3af; }
    td.actions { display:flex; gap:6px; flex-wrap:wrap; }
    td.actions button { padding:6px 10px; font-size:12px; }
    .role-pill { display:inline-block; padding:2px 9px; border-radius:99px; background:#eef2ff; color:#185FA5; font-weight:600; font-size:12px; text-transform:capitalize; }
    .msg { font-size:13px; min-height:18px; margin-top:10px; }
    .msg.err { color:#b42318; } .msg.ok { color:#047857; }
    .empty { color:#9ca3af; font-size:13px; padding:14px 0; }
    a.back { font-size:13px; color:var(--blue); text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/index.html">&larr; Back to dashboard</a>
    <h1 style="margin-top:12px;">Users &amp; Roles</h1>
    <p class="sub">Give each employee their own login. Their role decides which departments they can open. Admins see everything.</p>

    <div class="card">
      <h2>Add a user</h2>
      <div class="row">
        <div class="field"><label for="n-user">Username</label><input id="n-user" type="text" autocomplete="off" /></div>
        <div class="field"><label for="n-pass">Password</label><input id="n-pass" type="text" autocomplete="off" placeholder="min 4 characters" /></div>
        <div class="field"><label for="n-role">Role</label><select id="n-role"></select></div>
        <div class="field" style="flex:0 0 auto;"><button id="add-btn">Add user</button></div>
      </div>
      <div class="msg" id="add-msg"></div>
    </div>

    <div class="card">
      <h2>Team</h2>
      <table>
        <thead><tr><th>User</th><th>Role</th><th style="width:1%;">Actions</th></tr></thead>
        <tbody id="users-body"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
      </table>
      <div class="msg" id="list-msg"></div>
    </div>
  </div>

  <script src="/sidebar.js"></script>
  <script>
    var ROLES = [];
    var body = document.getElementById('users-body');

    function setMsg(el, text, kind) {
      el.textContent = text || '';
      el.className = 'msg' + (kind ? ' ' + kind : '');
    }
    function api(url, payload) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload || {})
      }).then(function (r) { return r.json(); });
    }

    function roleSelect(selected) {
      var sel = document.createElement('select');
      ROLES.forEach(function (r) {
        var o = document.createElement('option');
        o.value = r.id; o.textContent = r.label;
        if (r.id === selected) o.selected = true;
        sel.appendChild(o);
      });
      return sel;
    }

    function fillRoleDropdown() {
      var sel = document.getElementById('n-role');
      sel.textContent = '';
      ROLES.forEach(function (r) {
        var o = document.createElement('option');
        o.value = r.id; o.textContent = r.label;
        sel.appendChild(o);
      });
    }

    function renderUsers(users) {
      body.textContent = '';
      if (!users.length) {
        var tr = document.createElement('tr');
        var td = document.createElement('td');
        td.colSpan = 3; td.className = 'empty'; td.textContent = 'No users yet.';
        tr.appendChild(td); body.appendChild(tr);
        return;
      }
      users.forEach(function (u) {
        var tr = document.createElement('tr');

        var tdUser = document.createElement('td');
        tdUser.style.fontWeight = '600';
        tdUser.textContent = u.username;
        tr.appendChild(tdUser);

        // Role cell = inline dropdown to change role.
        var tdRole = document.createElement('td');
        var sel = roleSelect(u.role);
        sel.style.maxWidth = '190px';
        sel.addEventListener('change', function () {
          api('/api/admin/users/role', { username: u.username, role: sel.value }).then(function (d) {
            if (d.success) { setMsg(document.getElementById('list-msg'), 'Updated ' + u.username + '\u2019s role.', 'ok'); }
            else { sel.value = u.role; setMsg(document.getElementById('list-msg'), d.error || 'Could not change role', 'err'); }
          });
        });
        tdRole.appendChild(sel);
        tr.appendChild(tdRole);

        var tdAct = document.createElement('td');
        tdAct.className = 'actions';

        var resetBtn = document.createElement('button');
        resetBtn.className = 'ghost'; resetBtn.textContent = 'Reset password';
        resetBtn.addEventListener('click', function () {
          var pw = prompt('New password for ' + u.username + ' (min 4 chars):');
          if (pw == null) return;
          api('/api/admin/users/reset', { username: u.username, password: pw }).then(function (d) {
            setMsg(document.getElementById('list-msg'),
              d.success ? ('Password reset for ' + u.username) : (d.error || 'Could not reset'),
              d.success ? 'ok' : 'err');
          });
        });
        tdAct.appendChild(resetBtn);

        var delBtn = document.createElement('button');
        delBtn.className = 'danger'; delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', function () {
          if (!confirm('Delete user "' + u.username + '"? This cannot be undone.')) return;
          api('/api/admin/users/delete', { username: u.username }).then(function (d) {
            if (d.success) { load(); }
            else { setMsg(document.getElementById('list-msg'), d.error || 'Could not delete', 'err'); }
          });
        });
        tdAct.appendChild(delBtn);

        tr.appendChild(tdAct);
        body.appendChild(tr);
      });
    }

    function load() {
      fetch('/api/admin/users', { headers: { 'Accept': 'application/json' } })
        .then(function (r) {
          if (r.status === 403) { throw new Error('Admins only. Redirecting…'); }
          return r.json();
        })
        .then(function (d) {
          if (!d.success) throw new Error(d.error || 'Could not load users');
          ROLES = d.roles || [];
          fillRoleDropdown();
          renderUsers(d.users || []);
        })
        .catch(function (e) {
          setMsg(document.getElementById('list-msg'), e.message, 'err');
          if (/admin/i.test(e.message)) setTimeout(function () { location.href = '/index.html'; }, 1200);
        });
    }

    document.getElementById('add-btn').addEventListener('click', function () {
      var username = document.getElementById('n-user').value.trim();
      var password = document.getElementById('n-pass').value;
      var role = document.getElementById('n-role').value;
      if (!username || !password) { setMsg(document.getElementById('add-msg'), 'Enter a username and password', 'err'); return; }
      api('/api/admin/users', { username: username, password: password, role: role }).then(function (d) {
        if (d.success) {
          setMsg(document.getElementById('add-msg'), 'Added ' + d.username + ' (' + d.role + ')', 'ok');
          document.getElementById('n-user').value = '';
          document.getElementById('n-pass').value = '';
          load();
        } else {
          setMsg(document.getElementById('add-msg'), d.error || 'Could not add user', 'err');
        }
      });
    });

    load();
  </script>
</body>
</html>
