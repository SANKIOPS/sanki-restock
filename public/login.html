<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Sign in · SANKI Business OS</title>
  <style>
    :root { --blue:#185FA5; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%); color:#1a1a1a;
    }
    .card {
      width:100%; max-width:360px; background:#fff; border-radius:14px;
      box-shadow:0 20px 60px rgba(0,0,0,.35); padding:34px 30px 28px; margin:20px;
    }
    .brand { text-align:center; margin-bottom:22px; }
    .brand h1 { font-size:22px; margin:0; font-weight:800; letter-spacing:-.5px; }
    .brand p  { font-size:12px; color:#6b7280; margin:4px 0 0; }
    label { display:block; font-size:12px; font-weight:600; color:#374151; margin:14px 0 5px; }
    input {
      width:100%; padding:11px 12px; font-size:14px; border:1px solid #d1d5db;
      border-radius:8px; outline:none; transition:border .12s,box-shadow .12s;
    }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(24,95,165,.15); }
    button {
      width:100%; margin-top:20px; padding:12px; font-size:14px; font-weight:700;
      color:#fff; background:var(--blue); border:none; border-radius:8px; cursor:pointer;
      transition:background .12s;
    }
    button:hover { background:#134d86; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:14px; font-size:13px; min-height:18px; text-align:center; }
    .msg.err { color:#b42318; }
    .msg.ok  { color:#047857; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>&#9889; SANKI</h1>
      <p>Business OS — please sign in</p>
    </div>
    <form id="login-form" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="submit-btn" type="submit">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    var form = document.getElementById('login-form');
    var btn  = document.getElementById('submit-btn');
    var msg  = document.getElementById('msg');

    function show(text, kind) {
      msg.textContent = text || '';
      msg.className = 'msg' + (kind ? ' ' + kind : '');
    }

    // Do not automatically forward from login to a protected page. If a stale
    // browser credential/cookie disagrees with the page gate, auto-forwarding
    // creates /login.html ↔ /dashboard.html redirect loops. A successful form
    // login below still sends the user to their correct role home.

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      if (!username || !password) { show('Enter username and password', 'err'); return; }
      btn.disabled = true; show('Signing in…');
      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.success) {
            show('Welcome, ' + d.username + '!', 'ok');
            location.href = d.home || '/index.html';
          } else {
            btn.disabled = false;
            show((d && d.error) || 'Sign in failed', 'err');
          }
        })
        .catch(function () { btn.disabled = false; show('Network error — try again', 'err'); });
    });
  </script>
</body>
</html>
