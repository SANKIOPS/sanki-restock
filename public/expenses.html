<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Expenses · SANKI Business OS</title>
  <!-- PWA: installable, fullscreen home-screen app -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <meta name="theme-color" content="#0F5132" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SANKI" />
  <style>
    :root { --blue:#185FA5; --green:#047857; --red:#b42318; --amber:#b45309; --ink:#1a1a1a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f6f7f9; color:var(--ink); }
    .wrap { max-width:1120px; margin:0 auto; padding:22px 20px 90px; }
    h1 { font-size:22px; margin:0 0 2px; font-weight:800; }
    .sub { color:#6b7280; font-size:13px; margin:0 0 16px; }
    .tabs { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
    .tabs button { font-size:13px; padding:9px 16px; border:1px solid #d1d5db; background:#fff; border-radius:8px; cursor:pointer; font-weight:600; color:#374151; }
    .tabs button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .card { background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:12px; padding:18px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px 16px; }
    .fld { display:flex; flex-direction:column; min-width:0; }   /* min-width:0 lets grid/flex tracks shrink below input intrinsic width */
    .fld.full { grid-column:1 / -1; }
    .grid input, .grid select, .grid textarea, .filters input, .filters select { width:100%; min-width:0; }
    label { font-size:11px; font-weight:700; color:#374151; margin:0 0 4px; text-transform:uppercase; letter-spacing:.3px; }
    input, select, textarea { font-size:14px; padding:9px 11px; border:1px solid #d1d5db; border-radius:8px; outline:none; background:#fff; font-family:inherit; }
    input:focus, select:focus, textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(24,95,165,.13); }
    .row-actions { display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
    .btn { font-size:14px; padding:10px 18px; border:none; border-radius:8px; cursor:pointer; font-weight:700; }
    .btn.primary { background:var(--blue); color:#fff; }
    .btn.ghost { background:#fff; border:1px solid #d1d5db; color:#374151; }
    .btn.mini { font-size:12px; padding:6px 11px; }
    .btn.green { background:var(--green); color:#fff; }
    .btn.amber { background:var(--amber); color:#fff; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:9px 10px; text-align:left; border-bottom:1px solid #eef0f2; vertical-align:middle; }
    th { font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:#6b7280; background:#fafbfc; font-weight:700; }
    td.r, th.r { text-align:right; }
    .badge { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; }
    .b-pending { background:#fef3c7; color:var(--amber); }
    .b-approved { background:#dbeafe; color:var(--blue); }
    .b-paid { background:#d1fae5; color:var(--green); }
    .b-partially_paid, .b-partially_reimbursed { background:#e0e7ff; color:#4338ca; }
    .b-rejected { background:#fee2e2; color:var(--red); }
    .b-nobill { background:#fee2e2; color:var(--red); }
    .tag { font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; background:#eef2f7; color:#475569; }
    .mini-sel { font-size:11px; padding:1px 4px; border:1px solid #d1d5db; border-radius:5px; background:#fff; }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .stat { background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:10px; padding:10px 14px; min-width:120px; flex:1; }
    .stat .k { font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:#9ca3af; }
    .stat .v { font-size:19px; font-weight:800; margin-top:2px; }
    .msg { font-size:13px; min-height:18px; margin:8px 2px; }
    .msg.ok { color:var(--green); } .msg.err { color:var(--red); }
    .muted { color:#9ca3af; }
    .neg { color:var(--red); } .pos { color:var(--green); }
    .thumb { width:34px; height:34px; object-fit:cover; border-radius:6px; border:1px solid #d1d5db; cursor:pointer; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:flex-end; }
    .filters .fld { min-width:130px; }
    .hint { font-size:11px; color:#9ca3af; margin-top:3px; }
    .inline-request { margin-top:8px; padding:10px; border:1px solid #dbe3ec; border-radius:9px; background:#f8fafc; }
    .inline-request .request-actions { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .payment-choice { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .payment-choice label { display:flex; align-items:center; gap:8px; min-height:44px; margin:0; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; background:#fff; text-transform:none; letter-spacing:0; font-size:13px; cursor:pointer; }
    .payment-choice input { width:18px; height:18px; min-width:18px; margin:0; padding:0; accent-color:var(--blue); }
    .combo-wrap { position:relative; }
    .combo-menu { display:none; position:absolute; z-index:30; left:0; right:0; top:100%; max-height:220px; overflow:auto; margin-top:3px; background:#fff; border:1px solid #cbd5e1; border-radius:8px; box-shadow:0 10px 25px rgba(15,23,42,.16); }
    .combo-menu.open { display:block; }
    .combo-option { padding:10px 12px; cursor:pointer; border-bottom:1px solid #f1f5f9; font-size:14px; }
    .combo-option:last-child { border-bottom:0; }
    .combo-option:hover, .combo-option:focus { background:#eff6ff; outline:none; }
    dialog { border:none; border-radius:14px; padding:0; max-width:420px; width:92%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    dialog .dlg { padding:20px; }
    dialog h3 { margin:0 0 12px; font-size:17px; }
    .prev { max-width:100%; border-radius:8px; margin-top:8px; border:1px solid #d1d5db; }
    tr.flash > td { animation: flashRow 2.6s ease-out; }
    @keyframes flashRow { 0%,25% { background:#fef3c7; } 100% { background:transparent; } }

    /* ── Mobile: single column, roomy touch targets, tables become cards ── */
    @media (max-width:680px){
      .wrap { padding:16px 12px 96px; }
      h1 { font-size:20px; }
      .card { padding:14px; }
      .grid { grid-template-columns:1fr; }
      .grid > .fld, .grid > .fld.full { grid-column:1; width:100%; }
      .payment-choice { grid-template-columns:1fr; }
      .payment-choice label { width:100%; min-height:48px; }
      .inline-request .request-actions { align-items:stretch; flex-direction:column; }
      .inline-request .request-actions .btn { width:100%; }
      .tabs { gap:8px; }
      .tabs button { flex:1 1 auto; text-align:center; padding:11px 12px; }
      .row-actions { gap:8px; }
      .row-actions .btn { flex:1 1 auto; padding:13px 16px; }
      .btn.mini { padding:10px 14px; font-size:13px; }
      .mini-sel { font-size:14px; padding:6px 8px; }
      input, select, textarea { font-size:16px; }        /* 16px stops iOS zoom-on-focus */
      .filters .fld { flex:1 1 46%; min-width:0; }
      .stat { min-width:44%; }
      /* Stacked-card tables: each row becomes a labelled card */
      table.resp thead { display:none; }
      table.resp, table.resp tbody, table.resp tr, table.resp td { display:block; width:100%; }
      table.resp tr { border:1px solid #e5e7eb; border-radius:10px; margin-bottom:10px; padding:8px 12px; background:#fff; }
      table.resp td { border:none; padding:7px 0; display:flex; justify-content:space-between; align-items:center; gap:14px; text-align:right; }
      table.resp td:not(:last-child) { border-bottom:1px solid #f2f4f6; }
      table.resp td::before { content:attr(data-label); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.3px; color:#9ca3af; text-align:left; flex:0 0 auto; }
      table.resp td[data-label=""]::before { content:none; }
      table.resp input[type=number] { width:130px !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Expenses</h1>
    <p class="sub">Log → approve (bill proof) → pay (payment proof). Only approved business expenses reach the P&amp;L.</p>

    <div class="tabs" id="tabs">
      <button data-t="log" class="on">＋ Log expense</button>
      <button data-t="list">All expenses</button>
      <button data-t="vendors">Vendor ledgers</button>
      <button data-t="cash">Cash balances</button>
      <button data-t="reimbursements">Reimbursements</button>
    </div>

    <div id="panel"></div>
    <div class="msg" id="msg"></div>
  </div>

  <!-- payment dialog -->
  <dialog id="payDlg"><div class="dlg">
    <h3 id="payTitle">Record payment</h3>
    <div class="fld"><label id="payAcctLabel">Pay from account</label><select id="payAcct"></select></div>
    <div class="grid" style="margin-top:10px">
      <div class="fld"><label>Amount ₹</label><input type="number" id="payAmount" min="1" step="1"></div>
      <div class="fld"><label>Date</label><input type="date" id="payDate"></div>
      <div class="fld"><label>Payment type</label><select id="payType"><option>UPI</option><option>Cash</option><option>Credit</option></select></div>
      <div class="fld"><label>Note (optional)</label><input id="payNote"></div>
    </div>
    <div class="fld" style="margin-top:10px"><label id="payProofLabel">Payment proof — required</label><input type="file" id="payFile" accept="image/*" /></div>
    <img id="payPrev" class="prev" style="display:none" />
    <div class="row-actions">
      <button class="btn green" id="payGo" disabled>Mark paid</button>
      <button class="btn ghost" id="payCancel">Cancel</button>
    </div>
    <div class="msg" id="payMsg"></div>
  </div></dialog>

  <script src="/sidebar.js"></script>
  <script>
    var el = function(id){ return document.getElementById(id); };
    var fmt = function(n){ return '₹' + Math.round(n||0).toLocaleString('en-IN'); };
    var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
    var cfg = null, tab = 'log', payId = null, payUrl = '', payMode = 'vendor', focusId = '', expensesById = {};

    function api(url, opts){ return fetch(url, opts).then(function(r){ return r.json(); }); }
    function today(){ return new Date(Date.now()+5.5*3600*1000).toISOString().slice(0,10); }
    function setMsg(t, ok){ el('msg').className='msg '+(ok?'ok':'err'); el('msg').textContent=t||''; }

    function loadConfig(){ return api('/api/expenses/config').then(function(d){ cfg = d; }); }

    // ── tabs ──
    el('tabs').addEventListener('click', function(e){
      if(!e.target.dataset.t) return;
      tab = e.target.dataset.t;
      Array.prototype.forEach.call(el('tabs').children, function(b){ b.classList.toggle('on', b.dataset.t===tab); });
      render();
    });

    function render(){
      setMsg('');
      if(tab==='log') return renderLog();
      if(tab==='list') return renderList();
      if(tab==='vendors') return renderVendors();
      if(tab==='cash') return renderCash();
      if(tab==='reimbursements') return renderReimbursements();
      if(tab==='approvals') return renderApprovals();
    }

    // ── LOG form ──
    function opts(arr, sel){ return arr.map(function(o){ return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>'; }).join(''); }
    function renderLog(){
      el('panel').innerHTML =
      '<div class="card"><div class="grid">'+
        '<div class="fld"><label>Date</label><input type="date" id="f_date" value="'+today()+'"></div>'+
        '<div class="fld" id="normalAmountWrap"><label>Amount ₹</label><input type="number" id="f_amount" min="0" step="1" placeholder="0"></div>'+
        '<div class="fld full"><label>Particulars (what was it for)</label><input id="f_part" placeholder="e.g. lunch for install team, auto to vendor…"></div>'+
        '<div class="fld full"><label>Category (expense header)</label>'+
          '<input id="f_ledger" list="ledgerList" placeholder="type to search a category…" autocomplete="off">'+
          '<datalist id="ledgerList">'+cfg.ledgers.map(function(l){return '<option value="'+esc(l.name)+'">';}).join('')+'</datalist>'+
          '<div class="hint" id="ledgerHint"></div></div>'+
        (cfg.canApprove?'<div class="fld"><label>Type</label><select id="f_type">'+opts(cfg.types,'variable')+'</select></div>':'')+
        '<div class="fld"><label>Nature</label><input value="SANKI" disabled><div class="hint">SANKI business expense — counts in the P&amp;L</div></div>'+
        '<div class="fld combo-wrap"><label>Vendor</label><input id="f_vendor" placeholder="type 2–3 letters, or enter a new vendor" autocomplete="off" aria-autocomplete="list" aria-controls="vendorSuggestions"><div id="vendorSuggestions" class="combo-menu" role="listbox"></div><div class="hint">Select a matching vendor, or keep typing a new vendor name.</div></div>'+
        '<div class="fld full"><label>Have you already paid for this expense?</label><select id="f_paidalready"><option value="false">No — company must pay the vendor</option><option value="true">Yes — I paid personally</option></select></div>'+
        '<div class="fld"><label>Is this an installment / contract?</label><select id="f_installment"><option value="false">No</option><option value="true">Yes</option></select></div>'+
        '<div class="fld" id="totalAgreedWrap" style="display:none"><label>Total agreed amount ₹</label><input type="number" id="f_totalamount" min="1" step="1" placeholder="e.g. 10000"></div>'+
        '<div class="fld" id="requestedWrap" style="display:none"><label>Payment being logged now ₹</label><input type="number" id="f_requestedamount" min="1" step="1" placeholder="e.g. 1000"><div class="hint">Cannot exceed the total agreed amount.</div></div>'+
        '<div class="fld full" id="paymentNoteWrap" style="display:none"><label>Installment note (optional)</label><input id="f_paymentnote" placeholder="e.g. advance, second installment, final payment"></div>'+
        '<div class="fld" id="paymentTypeWrap"><label>Payment type</label><select id="f_paymenttype">'+opts(cfg.paymentTypes,'UPI')+'</select></div>'+
        '<div class="fld" id="qrPhotoWrap"><label>Vendor QR-code photo (required for UPI)</label><input type="file" id="f_qrphoto" accept="image/*"><div class="hint">Choose Camera, Photo Library, or Files.</div></div>'+
        '<div class="fld" id="personalProofWrap" style="display:none"><label>Your payment proof (required)</label><input type="file" id="f_personalproof" accept="image/*"><div class="hint">Screenshot or photo showing that you paid.</div></div>'+
        (cfg.canApprove?'<div class="fld"><label>Channel</label><select id="f_channel">'+opts(cfg.channels,'Shared')+'</select></div>':'')+
        '<div class="fld"><label>Bill type</label><select id="f_bill">'+opts(cfg.bills)+'</select></div>'+
        '<div class="fld" id="billPhotoWrap"><label>Bill photo (required)</label><input type="file" id="f_billfile" accept="image/*"><div class="hint" id="billHint">Printed or handwritten; choose Camera, Photo Library, or Files.</div></div>'+
      '</div>'+
      '<div class="row-actions"><button class="btn primary" id="saveExp">Log expense (pending)</button><span class="muted" id="upState"></span></div>'+
      '</div><div class="card"><b>Telegram expense updates</b><div class="hint">Link your own Telegram securely to receive approval, payment, and reimbursement updates.</div><div class="row-actions"><button class="btn ghost mini" id="linkTelegram">Link Telegram</button>'+(cfg.isAdmin?'<button class="btn ghost mini" id="setupTelegram">Connect existing bot</button><button class="btn ghost mini" id="testTelegram">Send test</button>':'')+'</div></div>';

      // Category combobox: known → auto-fill type; unknown → offer "request add"
      el('f_ledger').addEventListener('input', onLedgerInput);
      el('f_paymenttype').addEventListener('change', toggleQrPhoto);
      el('f_paidalready').addEventListener('change', togglePaymentFlow);
      el('f_installment').addEventListener('change', toggleInstallment);
      el('f_vendor').addEventListener('input',renderVendorSuggestions);
      el('f_vendor').addEventListener('focus',renderVendorSuggestions);
      document.removeEventListener('click',closeVendorSuggestions,true);
      document.addEventListener('click',closeVendorSuggestions,true);
      el('saveExp').addEventListener('click', saveExpense);
      el('linkTelegram').addEventListener('click',linkTelegram);
      if(el('setupTelegram'))el('setupTelegram').addEventListener('click',setupTelegram);
      if(el('testTelegram'))el('testTelegram').addEventListener('click',testTelegram);
      togglePaymentFlow(); toggleInstallment();
    }
    function renderVendorSuggestions(){
      var input=el('f_vendor'), menu=el('vendorSuggestions'), q=input.value.trim().toLowerCase();
      var matches=cfg.vendors.filter(function(v){return !q||v.toLowerCase().includes(q);}).slice(0,20);
      if(!matches.length){
        menu.innerHTML='<div class="combo-option" role="option" aria-disabled="true"><b>No existing match.</b><br><span class="muted">“'+esc(input.value.trim())+'” will be submitted as a new vendor.</span></div>';
        menu.classList.add('open'); return;
      }
      menu.innerHTML=matches.map(function(v){return '<div class="combo-option" role="option" tabindex="0" data-vendor="'+esc(v)+'">'+esc(v)+'</div>';}).join('');
      menu.classList.add('open');
      Array.prototype.forEach.call(menu.querySelectorAll('.combo-option'),function(o){
        o.addEventListener('mousedown',function(ev){ev.preventDefault();input.value=this.dataset.vendor;menu.classList.remove('open');});
        o.addEventListener('keydown',function(ev){if(ev.key==='Enter'){input.value=this.dataset.vendor;menu.classList.remove('open');input.focus();}});
      });
    }
    function closeVendorSuggestions(ev){if(el('vendorSuggestions')&&!el('vendorSuggestions').contains(ev.target)&&ev.target!==el('f_vendor'))el('vendorSuggestions').classList.remove('open');}
    function linkTelegram(){api('/api/telegram/link',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(d){if(!d.configured){setMsg('Telegram bot is not configured on Railway yet.',false);return;}if(d.url){window.open(d.url,'_blank');setMsg('Telegram opened. Tap Start within 15 minutes to finish linking.',true);}else setMsg('The admin must connect the existing bot once, then try again.',false);});}
    function setupTelegram(){api('/api/telegram/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(d){setMsg(d.success?'Existing Telegram bot connected. Now click Link Telegram.':(d.error||'Setup failed.'),!!d.success);});}
    function testTelegram(){api('/api/telegram/test',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(function(d){setMsg(d.success?'Test sent to '+d.sent+' approver chat(s).':(d.error||'Test failed.'),!!d.success);});}
    function togglePaymentFlow(){
      var paid=el('f_paidalready').value==='true';
      el('paymentTypeWrap').style.display=paid?'none':''; el('personalProofWrap').style.display=paid?'':'none';
      if(paid) el('f_qrphoto').value=''; toggleQrPhoto();
    }
    function toggleInstallment(){
      var yes=el('f_installment').value==='true';
      el('normalAmountWrap').style.display=yes?'none':''; el('totalAgreedWrap').style.display=yes?'':'none';
      el('requestedWrap').style.display=yes?'':'none'; el('paymentNoteWrap').style.display=yes?'':'none';
    }
    function toggleQrPhoto(){
      var upi=el('f_paidalready').value!=='true'&&el('f_paymenttype').value==='UPI';
      el('qrPhotoWrap').style.display=upi?'':'none';
      if(!upi) el('f_qrphoto').value='';
    }
    function findLedger(name){ return cfg.ledgers.find(function(l){ return l.name.toLowerCase()===String(name||'').toLowerCase(); }); }
    function onLedgerInput(){
      var v = el('f_ledger').value.trim();
      var m = findLedger(v);
      var hint = el('ledgerHint');
      if(m){ if(el('f_type')) el('f_type').value = m.type; hint.innerHTML = cfg.canApprove?'<span class="tag">'+esc(m.type)+'</span> known category':'Selected category'; return; }
      if(!v){ hint.textContent=''; return; }
      hint.innerHTML = 'New category — pick a type and request it: '+
        '<select id="newLedType" class="mini-sel">'+opts(cfg.types,'variable')+'</select> '+
        '<button class="btn mini ghost" id="reqLedBtn">Request add</button>';
      var b = document.getElementById('reqLedBtn');
      if(b) b.addEventListener('click', function(){ requestLedger(v, el('newLedType').value); });
    }
    function requestLedger(name, type){
      api('/api/expenses/requests', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ kind:'ledger', name:name, type:type }) })
        .then(function(d){
          if(!d.success){ setMsg(d.error||'Could not request.', false); return; }
          setMsg(d.already ? 'Already exists / already requested.' : 'Requested "'+name+'" — an admin will approve it, then you can log against it.', true);
        });
    }
    function requestAccount(){
      var nm = prompt('New paying account name (e.g. HDFC ....1234). It will need admin approval:'); if(!nm||!nm.trim()) return;
      var det = prompt('Bank / account details (optional):')||'';
      api('/api/expenses/requests', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ kind:'account', name:nm.trim(), details:det }) })
        .then(function(d){
          if(!d.success){ setMsg(d.error||'Could not request.', false); return; }
          setMsg(d.already ? 'Account already exists / requested.' : 'Requested account "'+nm.trim()+'" — pending admin approval.', true);
        });
    }
    function uploadFile(input){
      if(!input.files || !input.files[0]) return Promise.resolve('');
      var fd = new FormData(); fd.append('photo', input.files[0]);
      return api('/api/expenses/upload', { method:'POST', body:fd }).then(function(d){ return d.url || ''; });
    }

    function saveExpense(){
      var ledgerVal = el('f_ledger').value.trim();
      if(!findLedger(ledgerVal)){ setMsg('Pick an existing category. New ones must be requested & approved first (type it above → Request add).', false); return; }
      if(!el('f_vendor').value.trim()){setMsg('Enter or select a vendor name.',false);return;}
      if(!el('f_billfile').files[0]){ setMsg('Attach a printed or handwritten bill photo before submitting.', false); return; }
      var paidAlready=el('f_paidalready').value==='true', paymentType=paidAlready?'UPI':el('f_paymenttype').value;
      if(paidAlready&&!el('f_personalproof').files[0]){ setMsg('Attach proof of the payment you made.', false); return; }
      if(!paidAlready&&paymentType==='UPI'&&!el('f_qrphoto').files[0]){ setMsg('Attach the vendor QR-code photo for UPI payment.', false); return; }
      var installment=el('f_installment').value==='true';
      var totalAmount=installment?Number(el('f_totalamount').value):Number(el('f_amount').value);
      if(!(totalAmount>0)){setMsg(installment?'Enter the total agreed amount.':'Enter the expense amount.',false);return;}
      if(installment&&!(Number(el('f_requestedamount').value)>0)){setMsg('Enter the installment amount being logged now.',false);return;}
      if(installment&&Number(el('f_requestedamount').value)>totalAmount){setMsg('Payment being logged now cannot exceed the total agreed amount.',false);return;}
      var btn = el('saveExp'); btn.disabled=true; el('upState').textContent='uploading…';
      Promise.all([uploadFile(el('f_billfile')),(!paidAlready&&paymentType==='UPI')?uploadFile(el('f_qrphoto')):Promise.resolve(''),paidAlready?uploadFile(el('f_personalproof')):Promise.resolve('')]).then(function(urls){
        var body = {
          date: el('f_date').value, amount: totalAmount, particulars: el('f_part').value,
          ledger: ledgerVal, type: el('f_type')?el('f_type').value:'variable',
          vendor: el('f_vendor').value.trim(), paymentType:paymentType, paidAlready:paidAlready,
          isInstallment:installment, requestedAmount:installment?el('f_requestedamount').value:totalAmount,
          paymentNote:installment?el('f_paymentnote').value:'', personalPaymentProof:urls[2],
          channel:cfg.canApprove&&el('f_channel')?el('f_channel').value:'Shared', bill: el('f_bill').value,
          billPhoto:urls[0], qrPhoto:urls[1]
        };
        return api('/api/expenses', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      }).then(function(d){
        btn.disabled=false; el('upState').textContent='';
        if(d.success){ setMsg('Logged '+d.expense.id+' — pending approval.', true); loadConfig().then(renderLog); }
        else setMsg(d.error||'Could not save.', false);
      }).catch(function(){ btn.disabled=false; el('upState').textContent=''; setMsg('Upload/save failed.', false); });
    }

    // ── LIST ──
    function renderList(){
      el('panel').innerHTML = '<div class="card"><div class="filters" id="filters"></div>'+
        '<div class="stats" id="lstats"></div><div id="ltable" class="muted">Loading…</div></div>';
      el('filters').innerHTML =
        '<div class="fld"><label>From</label><input type="date" id="lf_from"></div>'+
        '<div class="fld"><label>To</label><input type="date" id="lf_to"></div>'+
        '<div class="fld"><label>Status</label><select id="lf_status"><option value="">All</option><option>pending</option><option>approved</option><option>partially_paid</option><option>paid</option><option>rejected</option></select></div>'+
        '<div class="fld"><label>Type</label><select id="lf_type"><option value="">All</option>'+opts(cfg.types)+'</select></div>'+
        '<button class="btn ghost mini" id="lf_go">Filter</button>';
      var n = new Date(Date.now()+5.5*3600*1000); var y=n.getUTCFullYear(), m=n.getUTCMonth();
      el('lf_from').value = y+'-'+String(m+1).padStart(2,'0')+'-01'; el('lf_to').value = today();
      el('lf_go').addEventListener('click', loadList);
      loadList();
    }
    function loadList(){
      var q = '?from='+el('lf_from').value+'&to='+el('lf_to').value+'&status='+el('lf_status').value+'&type='+el('lf_type').value;
      api('/api/expenses/list'+q).then(function(d){
        if(!d.success){ el('ltable').innerHTML='<span class="muted">No data.</span>'; return; }
        expensesById={}; d.expenses.forEach(function(e){expensesById[e.id]=e;});
        var t = d.totals;
        el('lstats').innerHTML =
          '<div class="stat"><div class="k">Total</div><div class="v">'+fmt(t.all)+'</div></div>'+
          '<div class="stat"><div class="k">Pending</div><div class="v">'+fmt(t.pending)+'</div></div>'+
          '<div class="stat"><div class="k">Approved</div><div class="v">'+fmt(t.approved)+'</div></div>'+
          '<div class="stat"><div class="k">Paid</div><div class="v">'+fmt(t.paid)+'</div></div>'+
          '<div class="stat"><div class="k">Missing bill (legacy)</div><div class="v '+(t.noBill?'neg':'')+'">'+fmt(t.noBill)+'</div></div>';
        if(!d.expenses.length){ el('ltable').innerHTML='<span class="muted">No expenses in range.</span>'; return; }
        var rows = d.expenses.map(function(e){
          var act = '';
          if(!cfg.canApprove){ act = '<span class="muted" style="font-size:11px">'+esc(e.status)+'</span>'; }
          else if(e.status==='pending') act = (canApproveExpense(e) ? '<button class="btn mini primary" onclick="approve(\''+e.id+'\')">Approve</button> ' : '<span class="badge b-nobill">proof incomplete</span> ')+
            '<button class="btn mini ghost" onclick="editExpense(\''+e.id+'\')">Edit</button> <button class="btn mini ghost" onclick="rejectExpense(\''+e.id+'\')">Reject</button>';
          else if(e.status==='approved'||e.status==='partially_paid') act = '<button class="btn mini green" onclick="openPay(\''+e.id+'\')">Record vendor payment</button>'+(e.status==='approved'?' <button class="btn mini ghost" onclick="approve(\''+e.id+'\')">Undo</button>':'');
          else if(e.status==='paid') act = e.paymentProof ? '<img class="thumb" src="'+esc(e.paymentProof)+'" onclick="window.open(this.src)" title="payment proof">' : '';
          return '<tr id="row_'+e.id+'">'+
            '<td data-label="Date">'+esc(e.date)+'<div class="muted" style="font-size:10px">'+e.id+'</div></td>'+
            '<td data-label="Particulars">'+esc(e.particulars||'—')+(e.vendor?'<div class="muted" style="font-size:11px">vendor: '+esc(e.vendor)+'</div>':'')+'</td>'+
            '<td data-label="Category">'+catCell(e)+'</td>'+
            '<td data-label="Claimant">'+esc(e.claimant||e.runner||e.createdBy||'—')+'</td>'+
            '<td data-label="Payment">'+paymentCell(e)+'</td>'+
            '<td class="r" data-label="Amount">'+fmt(e.amount)+(e.isInstallment?'<div class="muted" style="font-size:11px">paid '+fmt(e.paidAmount)+' · due '+fmt(Math.max(0,e.amount-e.paidAmount))+'</div>':'')+'</td>'+
            '<td data-label="Bill">'+billCell(e)+'</td>'+
            '<td data-label="Status"><span class="badge b-'+e.status+'">'+e.status+'</span></td>'+
            '<td data-label="Action">'+act+(cfg.canApprove?' <button class="btn mini ghost" onclick="delExp(\''+e.id+'\')">✕</button>':'')+'</td>'+
          '</tr>';
        }).join('');
        el('ltable').innerHTML = '<table class="resp"><thead><tr><th>Date</th><th>Particulars</th><th>Category</th><th>Claimant</th><th>Payment</th><th class="r">Amount</th><th>Bill</th><th>Status</th><th>Action</th></tr></thead><tbody>'+rows+'</tbody></table>';
        // Deep links can scroll to and highlight a specific expense row.
        if(focusId){ var row = el('row_'+focusId); if(row){ row.scrollIntoView({block:'center'}); row.classList.add('flash'); setTimeout(function(){ row.classList.remove('flash'); }, 2600); } focusId=''; }
      });
    }
    function canApproveExpense(e){
      if(e.bill==='none') return cfg.isAdmin&&e.fundedBy==='claimant'&&e.purchasePaymentProof&&e.exceptionEvidence&&(e.exceptionReason||e.billNote);
      return !!e.billPhoto;
    }
    function paymentCell(e){
      var type=esc(e.paymentType||e.account||'—');
      return (e.paidAlready?'<span class="tag">paid personally</span>':'<span class="tag">'+type+'</span>')+
        (e.qrPhoto?' <img class="thumb" src="'+esc(e.qrPhoto)+'" onclick="window.open(this.src)" title="vendor QR code">':'')+
        (e.purchasePaymentProof?' <img class="thumb" src="'+esc(e.purchasePaymentProof)+'" onclick="window.open(this.src)" title="personal payment proof">':'')+
        ((e.payments||[]).length?'<div class="muted" style="font-size:10px">'+(e.payments||[]).length+' payment(s)</div>':'');
    }
    // ── Category cell: static tags when locked, inline nature/type selects while pending ──
    function catCell(e){
      var led = '<div style="font-size:12px">'+esc(e.ledger||'—')+'</div>';
      if(e.status==='pending'){
        var typSel = '<select class="mini-sel" onchange="quickEdit(\''+e.id+'\',{type:this.value})">'+
          cfg.types.map(function(t){return '<option'+(t===e.type?' selected':'')+'>'+t+'</option>';}).join('')+'</select>';
        return led+'<div style="margin-top:3px">'+typSel+'</div>';
      }
      return led+'<div style="margin-top:3px"><span class="tag">'+esc(e.type)+'</span></div>';
    }
    // ── Bill cell: thumbnail, or attach control for legacy pending rows ──
    function billCell(e){
      if(e.billPhoto) return '<img class="thumb" src="'+esc(e.billPhoto)+'" onclick="window.open(this.src)" title="bill photo">';
      if(e.bill==='none') return '<span class="badge b-nobill" title="'+esc(e.exceptionReason||e.billNote||'')+'">no-bill exception</span> '+
        (e.purchasePaymentProof?'<img class="thumb" src="'+esc(e.purchasePaymentProof)+'" onclick="window.open(this.src)" title="claimant payment proof">':'')+
        (e.exceptionEvidence?'<img class="thumb" src="'+esc(e.exceptionEvidence)+'" onclick="window.open(this.src)" title="alternative evidence">':'');
      if(e.status==='pending'){
        return '<label class="btn mini ghost" style="cursor:pointer;margin:0">📎 Attach'+
          '<input type="file" accept="image/*" style="display:none" onchange="attachBill(\''+e.id+'\',this)"></label>';
      }
      return '<span class="muted">—</span>';
    }
    window.attachBill = function(id, input){
      if(!input.files[0]) return;
      setMsg('uploading bill…', true);
      uploadFile(input).then(function(url){
        if(!url){ setMsg('Upload failed.', false); return; }
        api('/api/expenses/'+id, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ billPhoto:url }) })
          .then(function(){ setMsg('Bill attached — you can approve now.', true); loadList(); });
      });
    };
    window.editExpense = function(id){
      api('/api/expenses/list').then(function(d){
        var e=d.expenses.find(function(x){return x.id===id;}); if(!e) return;
        var date=prompt('Date (YYYY-MM-DD):',e.date||''); if(date===null) return;
        var particulars=prompt('Particulars:',e.particulars||''); if(particulars===null) return;
        var amount=prompt('Amount ₹:',e.amount); if(amount===null) return;
        var ledger=prompt('Category (must match an existing category):',e.ledger||''); if(ledger===null) return;
        if(!findLedger(ledger)){ setMsg('The edited category must match an existing approved category.',false); return; }
        var type=prompt('Type ('+cfg.types.join(', ')+'):',e.type||'variable'); if(type===null) return;
        var vendor=prompt('Vendor (approved vendor name, or type a corrected/new name for admin to create):',e.vendor||''); if(vendor===null) return;
        var paymentType=prompt('Payment type ('+cfg.paymentTypes.join(', ')+'):',e.paymentType||'UPI'); if(paymentType===null) return;
        var installment=confirm('Is this a contract/installment expense?\nOK = Yes, Cancel = No');
        var requestedAmount=installment?prompt('Current payment requested / already paid ₹:',e.requestedAmount||e.amount):amount; if(requestedAmount===null) return;
        var account=prompt('Pay-from account:',e.account||''); if(account===null) return;
        var channel=prompt('Channel ('+cfg.channels.join(', ')+'):',e.channel||'Shared'); if(channel===null) return;
        api('/api/expenses/'+id, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({date:date,particulars:particulars,amount:amount,ledger:ledger,type:type,vendor:vendor,paymentType:paymentType,isInstallment:installment,requestedAmount:requestedAmount,account:account,channel:channel}) })
          .then(function(x){ if(x.success){ setMsg('Expense updated.',true); loadConfig().then(loadList); } else setMsg(x.error||'Could not update.',false); });
      });
    };
    window.quickEdit = function(id, patch){
      api('/api/expenses/'+id, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(patch) })
        .then(function(d){ if(!d.success) setMsg(d.error||'Could not update.', false); });
    };
    window.approve = function(id){
      api('/api/expenses/'+id+'/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' }).then(function(d){
        if(d.success) loadList(); else setMsg(d.error||'Could not approve.', false);
      });
    };
    window.rejectExpense = function(id){
      var reason=prompt('Reason for rejection:'); if(reason===null) return;
      api('/api/expenses/'+id+'/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:reason})}).then(function(d){
        if(d.success) loadList(); else setMsg(d.error||'Could not reject.',false);
      });
    };
    window.delExp = function(id){
      if(!confirm('Delete '+id+'?')) return;
      api('/api/expenses/'+id, { method:'DELETE' }).then(function(){ loadList(); });
    };

      el('payTitle').textContent='Record vendor payment'; el('payAcctLabel').textContent='Pay from account';
      el('payProofLabel').textContent='Company payment proof — required'; el('payGo').textContent='Save payment';
      el('payAcct').innerHTML = opts(cfg.accounts);
      el('payAmount').value=Math.max(0,(e.amount||0)-(e.paidAmount||0)); el('payDate').value=today(); el('payType').value=e.paymentType||'UPI'; el('payNote').value='';
      el('payFile').value=''; el('payPrev').style.display='none'; el('payGo').disabled=true; el('payMsg').textContent='';
      el('payDlg').showModal();
    };

      payId=id; payUrl=''; payMode='reimburse'; var e=expensesById[id]||{};
      el('payTitle').textContent='Reimburse '+(e.createdBy||e.claimant||'claimant'); el('payAcctLabel').textContent='Reimburse from account';
      el('payProofLabel').textContent='Company → claimant payment proof — required'; el('payGo').textContent='Save reimbursement';

      el('payDate').value=today(); el('payType').value='UPI'; el('payNote').value=''; el('payFile').value=''; el('payPrev').style.display='none'; el('payGo').disabled=true; el('payMsg').textContent=''; el('payDlg').showModal();
    };
    el('payCancel').addEventListener('click', function(){ el('payDlg').close(); });
    el('payFile').addEventListener('change', function(){
      if(!this.files[0]) return;
      el('payMsg').textContent='uploading…';
      uploadFile(this).then(function(url){
        payUrl=url; el('payGo').disabled=!url;
        if(url){ el('payPrev').src=url; el('payPrev').style.display=''; el('payMsg').textContent=''; }
      });
    });

      if(!payUrl){ el('payMsg').textContent='Screenshot required.'; return; }

    };
    function loadApprovals(){
      api('/api/expenses/requests?status=pending').then(function(d){
        if(!d.requests.length){ el('atable').innerHTML='<span class="muted">Nothing waiting. 🎉</span>'; return; }
        var rows = d.requests.map(function(r){
          var detail = r.kind==='ledger' ? ('<span class="tag">'+esc((r.meta&&r.meta.type)||'variable')+'</span>')
                                         : (r.meta&&r.meta.details ? '<span class="muted" style="font-size:11px">'+esc(r.meta.details)+'</span>' : '');
          var requested = r.kind==='vendor'
            ? '<input id="reqname_'+r.id+'" value="'+esc(r.name)+'" aria-label="Vendor name"> '+detail
            : '<b>'+esc(r.name)+'</b> '+detail;
          return '<tr><td data-label="Kind"><span class="tag">'+esc(r.kind)+'</span></td>'+
            '<td data-label="Requested">'+requested+'</td>'+
            '<td class="muted" data-label="By" style="font-size:11px">'+esc(r.by||'')+'<br>'+esc((r.at||'').slice(0,10))+'</td>'+
            '<td data-label=""><button class="btn mini green" onclick="decideReq(\''+r.id+'\',true,'+(r.kind==='vendor'?'true':'false')+')">Approve</button> '+
                '<button class="btn mini ghost" onclick="decideReq(\''+r.id+'\',false)">Reject</button></td></tr>';
        }).join('');
        el('atable').innerHTML = '<table class="resp"><thead><tr><th>Kind</th><th>Requested</th><th>By</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
      });
    }
    window.decideReq = function(id, approve, vendorRequest){
      var body={approve:approve};
      if(approve&&vendorRequest){ var inp=el('reqname_'+id); body.name=inp?inp.value.trim():''; }
      api('/api/expenses/requests/'+id+'/decide', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
        .then(function(d){
          if(!d.success){ setMsg(d.error||'Could not decide.', false); return; }
          loadConfig().then(function(){ syncApprovalsTab(); loadApprovals(); });
        });
    };
    // Show/update the approver/admin Approvals tab (with a pending-count badge).
    function syncApprovalsTab(){
      if(!cfg.canApprove) return;
      var existing = el('tabs').querySelector('[data-t="approvals"]');
      var label = 'Approvals'+(cfg.pendingCount ? ' ('+cfg.pendingCount+')' : '');
      if(existing){ existing.textContent = label; return; }
      var b = document.createElement('button');
      b.dataset.t = 'approvals'; b.textContent = label;
      el('tabs').appendChild(b);
    }

    // boot
    loadConfig().then(function(){
      if(!cfg.canApprove){ // claimant-only: log + view own list, nothing else
        var cashBtn = el('tabs').querySelector('[data-t="cash"]');
        if(cashBtn) cashBtn.remove();
        var vendorsBtn = el('tabs').querySelector('[data-t="vendors"]');
        if(vendorsBtn) vendorsBtn.remove();
        var reimburseBtn = el('tabs').querySelector('[data-t="reimbursements"]');
        if(reimburseBtn) reimburseBtn.remove();
      }
      syncApprovalsTab();
      // Optional deep links can open a particular expense or the approvals queue.
      var qs = new URLSearchParams(location.search);
      var f = qs.get('focus'), tp = qs.get('tab');
      if(f){ tab = 'list'; focusId = f; }
      else if(tp && el('tabs').querySelector('[data-t="'+tp+'"]')){ tab = tp; }
      Array.prototype.forEach.call(el('tabs').children, function(b){ b.classList.toggle('on', b.dataset.t===tab); });
      render();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
