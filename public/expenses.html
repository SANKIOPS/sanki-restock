<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Expenses · SANKI Business OS</title>
  <!-- PWA: installable, fullscreen home-screen app -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <meta name="theme-color" content="#0F5132" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SANKI" />
  <style>
    :root { --blue:#185FA5; --green:#047857; --red:#b42318; --amber:#b45309; --ink:#1a1a1a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f6f7f9; color:var(--ink); }
    .wrap { max-width:1120px; margin:0 auto; padding:22px 20px 90px; }
    h1 { font-size:22px; margin:0 0 2px; font-weight:800; }
    .sub { color:#6b7280; font-size:13px; margin:0 0 16px; }
    .tabs { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
    .tabs button { font-size:13px; padding:9px 16px; border:1px solid #d1d5db; background:#fff; border-radius:8px; cursor:pointer; font-weight:600; color:#374151; }
    .tabs button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .card { background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:12px; padding:18px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px 16px; }
    .fld { display:flex; flex-direction:column; min-width:0; }   /* min-width:0 lets grid/flex tracks shrink below input intrinsic width */
    .fld.full { grid-column:1 / -1; }
    .grid input, .grid select, .grid textarea, .filters input, .filters select { width:100%; min-width:0; }
    label { font-size:11px; font-weight:700; color:#374151; margin:0 0 4px; text-transform:uppercase; letter-spacing:.3px; }
    input, select, textarea { font-size:14px; padding:9px 11px; border:1px solid #d1d5db; border-radius:8px; outline:none; background:#fff; font-family:inherit; }
    input:focus, select:focus, textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(24,95,165,.13); }
    .row-actions { display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
    .btn { font-size:14px; padding:10px 18px; border:none; border-radius:8px; cursor:pointer; font-weight:700; }
    .btn.primary { background:var(--blue); color:#fff; }
    .btn.ghost { background:#fff; border:1px solid #d1d5db; color:#374151; }
    .btn.mini { font-size:12px; padding:6px 11px; }
    .btn.green { background:var(--green); color:#fff; }
    .btn.amber { background:var(--amber); color:#fff; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:9px 10px; text-align:left; border-bottom:1px solid #eef0f2; vertical-align:middle; }
    th { font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:#6b7280; background:#fafbfc; font-weight:700; }
    td.r, th.r { text-align:right; }
    .badge { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; }
    .b-pending { background:#fef3c7; color:var(--amber); }
    .b-approved { background:#dbeafe; color:var(--blue); }
    .b-paid { background:#d1fae5; color:var(--green); }
    .b-partially_paid, .b-partially_reimbursed { background:#e0e7ff; color:#4338ca; }
    .b-rejected { background:#fee2e2; color:var(--red); }
    .b-nobill { background:#fee2e2; color:var(--red); }
    .tag { font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; background:#eef2f7; color:#475569; }
    .mini-sel { font-size:11px; padding:1px 4px; border:1px solid #d1d5db; border-radius:5px; background:#fff; }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .stat { background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:10px; padding:10px 14px; min-width:120px; flex:1; }
    .stat .k { font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:#9ca3af; }
    .stat .v { font-size:19px; font-weight:800; margin-top:2px; }
    .msg { font-size:13px; min-height:18px; margin:8px 2px; }
    .msg.ok { color:var(--green); } .msg.err { color:var(--red); }
    .muted { color:#9ca3af; }
    .neg { color:var(--red); } .pos { color:var(--green); }
    .thumb { width:34px; height:34px; object-fit:cover; border-radius:6px; border:1px solid #d1d5db; cursor:pointer; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:flex-end; }
    .filters .fld { min-width:130px; }
    .hint { font-size:11px; color:#9ca3af; margin-top:3px; }
    .inline-request { margin-top:8px; padding:10px; border:1px solid #dbe3ec; border-radius:9px; background:#f8fafc; }
    .inline-request .request-actions { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .payment-choice { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .payment-choice label { display:flex; align-items:center; gap:8px; min-height:44px; margin:0; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; background:#fff; text-transform:none; letter-spacing:0; font-size:13px; cursor:pointer; }
    .payment-choice input { width:18px; height:18px; min-width:18px; margin:0; padding:0; accent-color:var(--blue); }
    .combo-wrap { position:relative; }
    .combo-menu { display:none; position:absolute; z-index:30; left:0; right:0; top:100%; max-height:220px; overflow:auto; margin-top:3px; background:#fff; border:1px solid #cbd5e1; border-radius:8px; box-shadow:0 10px 25px rgba(15,23,42,.16); }
    .combo-menu.open { display:block; }
    .combo-option { padding:10px 12px; cursor:pointer; border-bottom:1px solid #f1f5f9; font-size:14px; }
    .combo-option:last-child { border-bottom:0; }
    .combo-option:hover, .combo-option:focus { background:#eff6ff; outline:none; }
    dialog { border:none; border-radius:14px; padding:0; max-width:420px; width:92%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    dialog .dlg { padding:20px; }
    dialog h3 { margin:0 0 12px; font-size:17px; }
    .prev { max-width:100%; border-radius:8px; margin-top:8px; border:1px solid #d1d5db; }
    .claim-list { display:grid; gap:9px; }
    .claim-card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; color:var(--ink); overflow:hidden; }
    .claim-card summary { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; padding:10px 12px; cursor:pointer; list-style:none; }
    .claim-card summary::-webkit-details-marker { display:none; }
    .claim-card summary::after { content:'›'; color:#94a3b8; font-size:21px; line-height:16px; align-self:center; transform:rotate(90deg); transition:transform .15s ease; }
    .claim-card[open] summary::after { transform:rotate(-90deg); }
    .claim-head,.claim-main,.claim-proofs { display:flex; align-items:center; gap:9px; }
    .claim-head { justify-content:space-between; min-width:0; }
    .claim-date { font-size:11px; color:#6b7280; }
    .claim-id { font-size:10px; color:#9ca3af; margin-left:5px; }
    .claim-main { justify-content:space-between; grid-column:1 / -1; }
    .claim-desc { min-width:0; font-size:13px; font-weight:700; line-height:1.25; }
    .claim-vendor { font-size:11px; color:#6b7280; font-weight:400; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:210px; }
    .claim-amount { font-size:16px; font-weight:800; white-space:nowrap; }
    .claim-detail { padding:9px 12px 11px; border-top:1px solid #f1f3f5; background:#fafbfc; font-size:11px; color:#64748b; }
    .claim-meta { display:flex; flex-wrap:wrap; gap:5px 14px; }
    .claim-proofs { margin-top:8px; padding-top:8px; border-top:1px solid #e8edf2; }
    .claim-proof { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:#475569; font-weight:700; }
    .claim-proof .thumb { width:30px; height:30px; }
    .expense-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
    .expense-section { margin-top:9px; padding-top:9px; border-top:1px solid #e8edf2; }
    .payment-history { display:grid; gap:6px; margin-top:6px; }
    .payment-entry { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 9px; border-radius:7px; background:#fff; border:1px solid #e5e7eb; }
    .dash-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .dash-grid .card { margin:0; }
    .preset-row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
    .claim-stats .stat { padding:7px 10px; min-width:90px; }
    .claim-stats .stat .v { font-size:15px; }
    .claim-card.flash { animation:flashCard 2.6s ease-out; }
    @keyframes flashCard { 0%,25% { border-color:#f59e0b; background:#fffbeb; } 100% { border-color:#e5e7eb; background:#fff; } }
    tr.flash > td { animation: flashRow 2.6s ease-out; }
    @keyframes flashRow { 0%,25% { background:#fef3c7; } 100% { background:transparent; } }

    /* ── Mobile: single column, roomy touch targets, tables become cards ── */
    @media (max-width:680px){
      .wrap { padding:16px 12px 96px; }
      h1 { font-size:20px; }
      .card { padding:14px; }
      .grid { grid-template-columns:1fr; }
      .dash-grid { grid-template-columns:1fr; }
      .grid > .fld, .grid > .fld.full { grid-column:1; width:100%; }
      .payment-choice { grid-template-columns:1fr; }
      .payment-choice label { width:100%; min-height:48px; }
      .inline-request .request-actions { align-items:stretch; flex-direction:column; }
      .inline-request .request-actions .btn { width:100%; }
      .tabs { gap:8px; }
      .tabs button { flex:1 1 auto; text-align:center; padding:11px 12px; }
      .row-actions { gap:8px; }
      .row-actions .btn { flex:1 1 auto; padding:13px 16px; }
      .btn.mini { padding:10px 14px; font-size:13px; }
      .mini-sel { font-size:14px; padding:6px 8px; }
      input, select, textarea { font-size:16px; }        /* 16px stops iOS zoom-on-focus */
      .filters .fld { flex:1 1 46%; min-width:0; }
      .stat { min-width:44%; }
      /* Stacked-card tables: each row becomes a labelled card */
      table.resp thead { display:none; }
      table.resp, table.resp tbody, table.resp tr, table.resp td { display:block; width:100%; }
      table.resp tr { border:1px solid #e5e7eb; border-radius:10px; margin-bottom:10px; padding:8px 12px; background:#fff; }
      table.resp td { border:none; padding:7px 0; display:flex; justify-content:space-between; align-items:center; gap:14px; text-align:right; }
      table.resp td:not(:last-child) { border-bottom:1px solid #f2f4f6; }
      table.resp td::before { content:attr(data-label); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.3px; color:#9ca3af; text-align:left; flex:0 0 auto; }
      table.resp td[data-label=""]::before { content:none; }
      table.resp input[type=number] { width:130px !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Expenses</h1>
    <p class="sub">Log → approve (bill proof) → pay (payment proof). Only approved business expenses reach the P&amp;L.</p>

    <div class="tabs" id="tabs">
      <button data-t="log" class="on">＋ Log expense</button>
      <button data-t="list">All expenses</button>
      <button data-t="pending" id="pendingTab" style="display:none">Payables</button>
      <button data-t="receivables" id="receivablesTab" style="display:none">Receivables</button>
      <button data-t="spending" id="spendingTab" style="display:none">Spending dashboard</button>
      <button data-t="vendors">Vendor ledgers</button>
      <button data-t="cash">Account ledgers</button>
      <button data-t="reimbursements">Reimbursements</button>
    </div>

    <div id="panel"></div>
    <div class="msg" id="msg"></div>
  </div>

  <!-- payment dialog -->
  <dialog id="payDlg"><div class="dlg">
    <h3 id="payTitle">Record payment</h3>
    <div class="fld"><label id="payAcctLabel">Pay from account</label><select id="payAcct"></select>
      <button type="button" class="btn mini ghost" id="payAddAcct" style="margin-top:7px">＋ Add paying account</button></div>
    <div class="grid" style="margin-top:10px">
      <div class="fld"><label>Amount ₹</label><input type="number" id="payAmount" min="1" step="1"></div>
      <div class="fld"><label>Date</label><input type="date" id="payDate"></div>
      <div class="fld"><label>Payment type</label><select id="payType"><option>UPI</option><option>Cash</option><option>Credit</option></select></div>
      <div class="fld"><label>Note (optional)</label><input id="payNote"></div>
    </div>
    <div class="fld" style="margin-top:10px"><label id="payProofLabel">Payment proof — required</label><input type="file" id="payFile" accept="image/*" /></div>
    <img id="payPrev" class="prev" style="display:none" />
    <div class="row-actions">
      <button class="btn green" id="payGo" disabled>Mark paid</button>
      <button class="btn ghost" id="payCancel">Cancel</button>
    </div>
    <div class="msg" id="payMsg"></div>
  </div></dialog>

  <dialog id="approveDlg"><div class="dlg">
    <h3>Review and approve expense</h3>
    <div id="approveSummary" class="sub" style="margin-bottom:12px"></div>
    <div class="fld"><label>Category (required)</label><input id="approveCategory" list="approvalLedgerList" placeholder="Type to search or create a category" autocomplete="off"><datalist id="approvalLedgerList"></datalist><div class="hint">Choose an existing suggestion, or type a new category name to create it.</div></div>
    <div class="fld" style="margin-top:10px"><label>Type</label><select id="approveType"></select></div>
    <div class="row-actions">
      <button class="btn primary" id="approveGo">Assign category and approve</button>
      <button class="btn ghost" id="approveCancel">Cancel</button>
    </div>
    <div class="msg" id="approveMsg"></div>
  </div></dialog>

  <dialog id="adjDlg"><div class="dlg">
    <h3>Add account adjustment</h3>
    <div class="grid">
      <div class="fld"><label>Account</label><input id="adjAccount" readonly></div>
      <div class="fld"><label>Adjustment</label><select id="adjDirection"><option value="add">Add money</option><option value="deduct">Deduct money</option></select></div>
      <div class="fld"><label>Amount ₹</label><input type="number" id="adjAmount" min="1"></div>
      <div class="fld"><label>Date</label><input type="date" id="adjDate"></div>
      <div class="fld full"><label>Reason — required</label><input id="adjReason" placeholder="Why is this balance being adjusted?"></div>
      <div class="fld full"><label>Proof — optional</label><input type="file" id="adjProof" accept="image/*"></div>
    </div>
    <div class="row-actions"><button class="btn primary" id="adjGo">Save adjustment</button><button class="btn ghost" id="adjCancel">Cancel</button></div>
    <div class="msg" id="adjMsg"></div>
  </div></dialog>

  <dialog id="receiveDlg"><div class="dlg">
    <h3>Record money received</h3><div id="receiveSummary" class="sub"></div>
    <div class="grid"><div class="fld"><label>Receiving account</label><select id="receiveAccount"></select></div><div class="fld"><label>Amount ₹</label><input type="number" id="receiveAmount" min="1"></div><div class="fld"><label>Date</label><input type="date" id="receiveDate"></div><div class="fld"><label>Note</label><input id="receiveNote"></div><div class="fld full"><label>Collection proof — required</label><input type="file" id="receiveProof" accept="image/*"></div></div>
    <div class="row-actions"><button class="btn green" id="receiveGo">Save collection</button><button class="btn ghost" id="receiveCancel">Cancel</button></div><div class="msg" id="receiveMsg"></div>
  </div></dialog>

  <script src="/sidebar.js"></script>
  <script>
    var el = function(id){ return document.getElementById(id); };
    var fmt = function(n){ return '₹' + Math.round(n||0).toLocaleString('en-IN'); };
    var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
    var cfg = null, tab = 'log', payId = null, payUrl = '', payMode = 'vendor', approveId = '', focusId = '', focusedExpenseId = '', expensesById = {}, selectedNature = 'SANKI', receiveId = '', receivablesById = {}, spendingData = null;

    function api(url, opts){ return fetch(url, opts).then(function(r){ return r.json(); }); }
    function today(){ return new Date(Date.now()+5.5*3600*1000).toISOString().slice(0,10); }
    function setMsg(t, ok){ el('msg').className='msg '+(ok?'ok':'err'); el('msg').textContent=t||''; }

    function loadConfig(){ return api('/api/expenses/config').then(function(d){ cfg = d; if(el('approvalLedgerList')) el('approvalLedgerList').innerHTML=cfg.ledgers.map(function(l){return '<option value="'+esc(l.name)+'">';}).join(''); }); }

    // ── tabs ──
    el('tabs').addEventListener('click', function(e){
      if(!e.target.dataset.t) return;
      tab = e.target.dataset.t;
      Array.prototype.forEach.call(el('tabs').children, function(b){ b.classList.toggle('on', b.dataset.t===tab); });
      render();
    });

    function render(){
      setMsg('');
      if(tab==='log') return renderLog();
      if(tab==='list') return renderList();
      if(tab==='pending') return renderPendingPayments();
      if(tab==='receivables') return renderReceivables();
      if(tab==='spending') return renderSpendingDashboard();
      if(tab==='vendors') return renderVendors();
      if(tab==='cash') return renderCash();
      if(tab==='reimbursements') return renderReimbursements();
      if(tab==='approvals') return renderApprovals();
    }

    // ── LOG form ──
    function opts(arr, sel){ return arr.map(function(o){ return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>'; }).join(''); }
    function renderLog(){
      el('panel').innerHTML =
      '<div class="card"><div class="grid">'+
        '<div class="fld"><label>Date</label><input type="date" id="f_date" value="'+today()+'"></div>'+
        '<div class="fld" id="normalAmountWrap"><label>Amount ₹</label><input type="number" id="f_amount" min="0" step="1" placeholder="0"></div>'+
        '<div class="fld full"><label>Particulars (what was it for)</label><input id="f_part" placeholder="e.g. lunch for install team, auto to vendor…"></div>'+
        (cfg.isAdmin?'<div class="fld full"><label>Category (expense header)</label>'+
          '<input id="f_ledger" list="ledgerList" placeholder="type to search a category…" autocomplete="off">'+
          '<datalist id="ledgerList">'+cfg.ledgers.map(function(l){return '<option value="'+esc(l.name)+'">';}).join('')+'</datalist>'+
          '<div class="hint" id="ledgerHint"></div></div>':'')+
        (cfg.isAdmin?'<div class="fld"><label>Type</label><select id="f_type">'+opts(cfg.types,'variable')+'</select></div>':'')+
        '<div class="fld"><label>Accounting entity / nature</label><select id="f_nature">'+opts(cfg.natures,selectedNature)+'</select><div class="hint">Choose SANKI, SAMAST (Kirti Nagar), or owner-private PERSONAL.</div></div>'+
        '<div class="fld combo-wrap"><label>Vendor</label><input id="f_vendor" placeholder="type 2–3 letters, or enter a new vendor" autocomplete="off" aria-autocomplete="list" aria-controls="vendorSuggestions"><div id="vendorSuggestions" class="combo-menu" role="listbox"></div><div class="hint">Select a matching vendor, or keep typing a new vendor name.</div></div>'+
        '<div class="fld full"><label>Have you already paid for this expense?</label><select id="f_paidalready"><option value="false">No — company must pay the vendor</option><option value="true">Yes — I paid personally</option></select></div>'+
        '<div class="fld"><label>Is this an installment / contract?</label><select id="f_installment"><option value="false">No</option><option value="true">Yes</option></select></div>'+
        '<div class="fld" id="totalAgreedWrap" style="display:none"><label>Total agreed amount ₹</label><input type="number" id="f_totalamount" min="1" step="1" placeholder="e.g. 10000"></div>'+
        '<div class="fld" id="requestedWrap" style="display:none"><label>Payment being logged now ₹</label><input type="number" id="f_requestedamount" min="1" step="1" placeholder="e.g. 1000"><div class="hint">Cannot exceed the total agreed amount.</div></div>'+
        '<div class="fld full" id="paymentNoteWrap" style="display:none"><label>Installment note (optional)</label><input id="f_paymentnote" placeholder="e.g. advance, second installment, final payment"></div>'+
        '<div class="fld" id="paymentTypeWrap"><label>Payment type</label><select id="f_paymenttype">'+opts(cfg.paymentTypes,'UPI')+'</select></div>'+
        '<div class="fld" id="qrPhotoWrap"><label>Vendor QR-code photo (required for UPI)</label><input type="file" id="f_qrphoto" accept="image/*"><div class="hint">Choose Camera, Photo Library, or Files.</div></div>'+
        '<div class="fld" id="personalProofWrap" style="display:none"><label>Your payment proof (required)</label><input type="file" id="f_personalproof" accept="image/*"><div class="hint">Screenshot or photo showing that you paid.</div></div>'+
        (cfg.isAdmin?'<div class="fld"><label>Channel</label><select id="f_channel">'+opts(cfg.channels,'Shared')+'</select></div>':'')+
        '<div class="fld"><label>Bill type</label><select id="f_bill">'+opts(cfg.bills)+'</select></div>'+
        '<div class="fld" id="billPhotoWrap"><label>Bill photo (required)</label><input type="file" id="f_billfile" accept="image/*"><div class="hint" id="billHint">Printed or handwritten; choose Camera, Photo Library, or Files.</div></div>'+
      '</div>'+
      '<div class="row-actions"><button class="btn primary" id="saveExp">Log expense (pending)</button><span class="muted" id="upState"></span></div>'+
      '</div>'+(cfg.isOwner?'<div class="card"><b>Telegram notifications (Owner only)</b><div class="hint">Set up each claimant, approver, accountant, or other user who needs notifications. Generate a 15-minute link and send it to that user; they must tap Start once.</div><div id="telegramBotStatus" class="hint">Checking bot connection…</div><div class="row-actions"><select id="telegramUser"><option value="">Loading users…</option></select><button class="btn ghost mini" id="linkTelegram">Generate / relink</button><button class="btn ghost mini" id="testTelegram">Test selected user</button><button class="btn ghost mini" id="unlinkTelegram">Disconnect selected user</button><button class="btn ghost mini" id="setupTelegram">Connect existing bot</button></div><div id="telegramUserStatus" class="hint"></div><div id="telegramLinkResult" class="hint"></div></div>':'');

      // Category combobox: known → auto-fill type; unknown → offer "request add"
      if(el('f_ledger')) el('f_ledger').addEventListener('input', onLedgerInput);
      el('f_paymenttype').addEventListener('change', toggleQrPhoto);

    function saveExpense(){
      var ledgerVal = el('f_ledger')?el('f_ledger').value.trim():'';
      if(el('f_ledger')&&!findLedger(ledgerVal)){ setMsg('Pick an existing category.', false); return; }
      if(!el('f_vendor').value.trim()){setMsg('Enter or select a vendor name.',false);return;}
      if(!el('f_billfile').files[0]){ setMsg('Attach a printed or handwritten bill photo before submitting.', false); return; }
      var paidAlready=el('f_paidalready').value==='true', paymentType=paidAlready?'UPI':el('f_paymenttype').value;
      if(paidAlready&&!el('f_personalproof').files[0]){ setMsg('Attach proof of the payment you made.', false); return; }
      if(!paidAlready&&paymentType==='UPI'&&!el('f_qrphoto').files[0]){ setMsg('Attach the vendor QR-code photo for UPI payment.', false); return; }
      var installment=el('f_installment').value==='true';
      var totalAmount=installment?Number(el('f_totalamount').value):Number(el('f_amount').value);
      if(!(totalAmount>0)){setMsg(installment?'Enter the total agreed amount.':'Enter the expense amount.',false);return;}
      if(installment&&!(Number(el('f_requestedamount').value)>0)){setMsg('Enter the installment amount being logged now.',false);return;}
      if(installment&&Number(el('f_requestedamount').value)>totalAmount){setMsg('Payment being logged now cannot exceed the total agreed amount.',false);return;}
      var btn = el('saveExp'); btn.disabled=true; el('upState').textContent='uploading…';
      Promise.all([uploadFile(el('f_billfile')),(!paidAlready&&paymentType==='UPI')?uploadFile(el('f_qrphoto')):Promise.resolve(''),paidAlready?uploadFile(el('f_personalproof')):Promise.resolve('')]).then(function(urls){
        var body = {
          date: el('f_date').value, amount: totalAmount, particulars: el('f_part').value, nature:el('f_nature').value,

          isInstallment:installment, requestedAmount:installment?el('f_requestedamount').value:totalAmount,
          paymentNote:installment?el('f_paymentnote').value:'', personalPaymentProof:urls[2],
          channel:cfg.isAdmin&&el('f_channel')?el('f_channel').value:'Shared', bill: el('f_bill').value,
          billPhoto:urls[0], qrPhoto:urls[1]
        };
        return api('/api/expenses', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      }).then(function(d){
        btn.disabled=false; el('upState').textContent='';

    }

    function loadVendors(){
      api('/api/expenses/vendors?nature='+encodeURIComponent(selectedNature)).then(function(d){
        if(!d.vendors.length){ el('vtable').innerHTML='<span class="muted">No vendors yet.</span>'; return; }
        var rows = d.vendors.map(function(v){
          return '<tr><td>'+esc(v.name)+'</td><td class="r">'+v.count+'</td><td class="r">'+fmt(v.billed)+'</td><td class="r">'+fmt(v.paid)+'</td><td class="r '+(v.outstanding>0?'neg':'')+'">'+fmt(v.outstanding)+'</td></tr>';
        }).join('');
        el('vtable').innerHTML = '<table><thead><tr><th>Vendor</th><th class="r">Entries</th><th class="r">Billed</th><th class="r">Paid</th><th class="r">Outstanding</th></tr></thead><tbody>'+rows+'</tbody>'+
          '<tfoot><tr><th>Total owed</th><th></th><th></th><th></th><th class="r neg">'+fmt(d.totalOutstanding)+'</th></tr></tfoot></table>';
      });
    }

    // ── ACCOUNT LEDGERS & ACCOUNT-TO-ACCOUNT TRANSFERS ──
    function renderCash(){
      el('panel').innerHTML = '<div class="card"><h3 style="margin:0 0 4px">Money Trail</h3><p class="sub" style="margin:0 0 12px">One-click view of where money entered, where it was spent, and what remains.</p><div class="filters"><div class="fld"><label>Entity</label><select id="cf_nature">'+opts(cfg.approvalNatures||cfg.natures,selectedNature)+'</select></div></div><div id="ctable" class="muted">Loading…</div></div>'+
        '<div class="card"><h3 style="margin-top:0">Transfer between accounts</h3><div class="grid"><div class="fld"><label>From account</label><select id="tr_from">'+opts(cfg.accounts)+'</select></div><div class="fld"><label>To account</label><select id="tr_to">'+opts(cfg.accounts)+'</select></div><div class="fld"><label>Amount ₹</label><input type="number" id="tr_amount" min="1"></div><div class="fld"><label>Date</label><input type="date" id="tr_date" value="'+today()+'"></div><div class="fld full"><label>Note</label><input id="tr_note" placeholder="Reason or reference"></div><div class="fld full"><label>Transfer proof — required</label><input type="file" id="tr_proof" accept="image/*"></div></div><div class="row-actions"><button class="btn primary" id="tr_go">Record transfer</button></div></div>'+
        '<div class="card"><h3 style="margin-top:0">Detailed statement</h3><div class="filters"><div class="fld"><label>Account</label><select id="lg_account">'+opts(cfg.accounts)+'</select></div><div class="fld"><label>From</label><input type="date" id="lg_from"></div><div class="fld"><label>To</label><input type="date" id="lg_to" value="'+today()+'"></div><button class="btn ghost mini" id="lg_go">View ledger</button></div><div id="ledgerTable" class="muted">Select an account.</div></div>';
      el('cf_nature').addEventListener('change',function(){selectedNature=this.value;loadCash();loadAccountLedger();});
      el('tr_go').addEventListener('click',recordTransfer); el('lg_go').addEventListener('click',loadAccountLedger);
      loadCash();
    }
    function loadCash(){
      api('/api/expenses/balances?nature='+encodeURIComponent(selectedNature)).then(function(d){
        var rows = d.accounts.map(function(a,i){var moneyIn=(a.received||0)+(a.transferredIn||0)+Math.max(0,a.topups||0),moneyOut=(a.spent||0)+(a.transferredOut||0)+Math.max(0,-(a.topups||0));return '<details class="claim-card" ontoggle="if(this.open)loadMoneyTrail(\''+esc(a.name)+'\',\'trail_'+i+'\')"><summary><div class="claim-main"><div class="claim-desc">'+esc(a.name)+'<div class="claim-vendor">Opening '+fmt(a.opening)+'</div></div><div class="claim-amount">'+fmt(a.balance)+' balance</div></div><div class="claim-meta"><span class="pos">Received '+fmt(moneyIn)+'</span><span class="neg">Spent '+fmt(moneyOut)+'</span></div></summary><div class="claim-detail"><div id="trail_'+i+'" class="muted">Loading money trail…</div><div class="expense-actions"><button class="btn mini ghost" onclick="openAdjustment(\''+esc(a.name)+'\')">＋ Add adjustment</button> <button class="btn mini ghost" onclick="selectDetailedAccount(\''+esc(a.name)+'\')">Open detailed statement</button>'+(cfg.isAdmin?' <button class="btn mini ghost" onclick="removeAcct(\''+esc(a.name)+'\')">✕</button>':'')+'</div></div></details>';}).join('');
        el('ctable').innerHTML = '<div class="claim-list">'+rows+'</div>'+
          '<div class="row-actions"><a href="#" id="addAcctLink2">＋ add a paying account'+(cfg.isAdmin?'':' (needs approval)')+'</a></div>'+
          '<div class="hint" style="margin-top:8px">Balance = opening + adjustments + receivable collections + transfers in − transfers out − paid expenses and reimbursements.</div>';
        el('addAcctLink2').addEventListener('click', function(ev){ ev.preventDefault(); requestAccount(); });
      });
    }
    window.loadMoneyTrail=function(account,host){var box=el(host);if(!box||box.dataset.loaded)return;box.dataset.loaded='1';api('/api/expenses/account-ledger?nature='+encodeURIComponent(selectedNature)+'&account='+encodeURIComponent(account)).then(function(d){if(!d.success){box.textContent=d.error||'Could not load trail.';return;}var rows=d.entries.map(function(x){return '<tr><td>'+esc(x.date||'Opening')+'</td><td>'+esc(x.description)+'</td><td class="r pos">'+(x.credit?fmt(x.credit):'—')+'</td><td class="r neg">'+(x.debit?fmt(x.debit):'—')+'</td><td class="r"><b>'+fmt(x.balance)+'</b></td><td>'+(x.proof?'<img class="thumb" src="'+esc(x.proof)+'" onclick="window.open(this.src)">':'')+'</td></tr>';}).join('');box.innerHTML='<table class="resp"><thead><tr><th>Date</th><th>Where money went / came from</th><th class="r">In</th><th class="r">Out</th><th class="r">Balance</th><th>Proof</th></tr></thead><tbody>'+rows+'</tbody></table>';});};
    window.selectDetailedAccount=function(account){el('lg_account').value=account;loadAccountLedger();el('lg_account').scrollIntoView({behavior:'smooth',block:'center'});};
    function recordTransfer(){
      var from=el('tr_from').value,to=el('tr_to').value,amount=Number(el('tr_amount').value||0),btn=el('tr_go');
      if(from===to){setMsg('Choose two different accounts.',false);return;} if(!(amount>0)){setMsg('Enter a transfer amount.',false);return;} if(!el('tr_proof').files[0]){setMsg('Transfer proof is required.',false);return;}
      btn.disabled=true; uploadFile(el('tr_proof'),selectedNature).then(function(proof){return api('/api/expenses/transfers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nature:selectedNature,fromAccount:from,toAccount:to,amount:amount,date:el('tr_date').value,note:el('tr_note').value,proof:proof})});}).then(function(d){btn.disabled=false;if(!d.success){setMsg(d.error||'Transfer failed.',false);return;}setMsg('Transfer '+d.transfer.id+' recorded in both account ledgers.',true);el('tr_amount').value='';el('tr_note').value='';el('tr_proof').value='';loadCash();loadAccountLedger();}).catch(function(){btn.disabled=false;setMsg('Transfer upload failed.',false);});
    }
    function loadAccountLedger(){
      var account=el('lg_account').value;if(!account)return;
      api('/api/expenses/account-ledger?nature='+encodeURIComponent(selectedNature)+'&account='+encodeURIComponent(account)+'&from='+el('lg_from').value+'&to='+el('lg_to').value).then(function(d){
        if(!d.success){el('ledgerTable').textContent=d.error||'Could not load ledger.';return;}
        var rows=d.entries.map(function(x){return '<tr><td>'+esc(x.date||'Opening')+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.id)+'</td><td class="r pos">'+(x.credit?fmt(x.credit):'—')+'</td><td class="r neg">'+(x.debit?fmt(x.debit):'—')+'</td><td class="r"><b>'+fmt(x.balance)+'</b></td><td>'+(x.proof?'<img class="thumb" src="'+esc(x.proof)+'" onclick="window.open(this.src)" alt="proof">':'')+'</td></tr>';}).join('');
        el('ledgerTable').innerHTML='<div class="stat" style="margin-bottom:10px"><div class="k">Current balance · '+esc(d.account)+'</div><div class="v">'+fmt(d.balance)+'</div></div><table class="resp"><thead><tr><th>Date</th><th>Description</th><th>Reference</th><th class="r">Credit</th><th class="r">Debit</th><th class="r">Balance</th><th>Proof</th></tr></thead><tbody>'+rows+'</tbody></table>';
      });
    }
    window.setOpening = function(acct, amt){
      api('/api/expenses/balances', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ nature:selectedNature,setOpening:{account:acct, amount:amt} }) }).then(function(){ loadCash(); });
    };
    window.openAdjustment = function(acct){el('adjAccount').value=acct;el('adjDirection').value='add';el('adjAmount').value='';el('adjDate').value=today();el('adjReason').value='';el('adjProof').value='';el('adjMsg').textContent='';el('adjDlg').showModal();};
    el('adjCancel').addEventListener('click',function(){el('adjDlg').close();});
    el('adjGo').addEventListener('click',function(){
      var amount=Number(el('adjAmount').value||0),reason=el('adjReason').value.trim(),btn=el('adjGo');
      if(!(amount>0)){el('adjMsg').textContent='Enter an amount greater than zero.';return;}if(!reason){el('adjMsg').textContent='Reason is required.';return;}
      btn.disabled=true;var upload=el('adjProof').files[0]?uploadFile(el('adjProof'),selectedNature):Promise.resolve('');
      upload.then(function(proof){return api('/api/expenses/balances',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nature:selectedNature,adjust:{account:el('adjAccount').value,direction:el('adjDirection').value,amount:amount,date:el('adjDate').value,note:reason,proof:proof}})});}).then(function(d){btn.disabled=false;if(!d.success){el('adjMsg').textContent=d.error||'Could not save adjustment.';return;}el('adjDlg').close();setMsg('Account adjustment recorded.',true);loadCash();loadAccountLedger();}).catch(function(){btn.disabled=false;el('adjMsg').textContent='Could not upload/save adjustment.';});
    });

    window.removeAcct = function(name){
      if(!confirm('Remove account "'+name+'"? (history is kept)')) return;
      api('/api/expenses/accounts/remove', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name}) })
        .then(function(){ loadConfig().then(loadCash); });
    };

    // ── APPROVALS — approvers handle vendors; admin also handles categories/accounts ──
    function renderApprovals(){
      el('panel').innerHTML = '<div class="card"><h3 style="margin:0 0 4px">Pending approvals</h3>'+
        '<p class="sub" style="margin:0 0 12px">Review vendor requests'+(cfg.isAdmin?', categories, and paying accounts':'')+' before they become selectable.</p>'+
        '<div id="atable" class="muted">Loading…</div></div>'+(cfg.isAdmin?(
        '<div class="card"><h3 style="margin:0 0 4px">Approved custom categories</h3>'+
        '<p class="sub" style="margin:0 0 12px">Extra categories added beyond the built-in Tally list. Remove one if it was a mistake.</p>'+
        '<div id="ctable2" class="muted">Loading…</div></div>'):'');
      loadApprovals(); if(cfg.isAdmin) loadCustomLedgers();
    };
    function loadCustomLedgers(){
      api('/api/expenses/custom-ledgers').then(function(d){
        if(!d.ledgers.length){ el('ctable2').innerHTML='<span class="muted">None yet.</span>'; return; }
        el('ctable2').innerHTML = '<table><tbody>'+d.ledgers.map(function(l){
          return '<tr><td><b>'+esc(l.name)+'</b> <span class="tag">'+esc(l.type||'variable')+'</span></td>'+
            '<td class="r"><button class="btn mini ghost" onclick="removeCustomLedger(\''+esc(l.name).replace(/'/g,"\\'")+'\')">✕ remove</button></td></tr>';
        }).join('')+'</tbody></table>';
      });
    }
    window.removeCustomLedger = function(name){
      if(!confirm('Remove custom category "'+name+'"?')) return;
      api('/api/expenses/custom-ledgers/remove', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name}) })
        .then(function(){ loadConfig().then(loadCustomLedgers); });
    };
    function loadApprovals(){
      api('/api/expenses/requests?status=pending').then(function(d){
        if(!d.requests.length){ el('atable').innerHTML='<span class="muted">Nothing waiting. 🎉</span>'; return; }
        var rows = d.requests.map(function(r){
          var detail = r.kind==='ledger' ? ('<span class="tag">'+esc((r.meta&&r.meta.type)||'variable')+'</span>')
                                         : (r.meta&&r.meta.details ? '<span class="muted" style="font-size:11px">'+esc(r.meta.details)+'</span>' : '');
          var requested = r.kind==='vendor'
            ? '<input id="reqname_'+r.id+'" value="'+esc(r.name)+'" aria-label="Vendor name"> '+detail
            : '<b>'+esc(r.name)+'</b> '+detail;
          return '<tr><td data-label="Kind"><span class="tag">'+esc(r.kind)+'</span></td>'+
            '<td data-label="Requested">'+requested+'</td>'+
            '<td class="muted" data-label="By" style="font-size:11px">'+esc(r.by||'')+'<br>'+esc((r.at||'').slice(0,10))+'</td>'+
            '<td data-label=""><button class="btn mini green" onclick="decideReq(\''+r.id+'\',true,'+(r.kind==='vendor'?'true':'false')+')">Approve</button> '+
                '<button class="btn mini ghost" onclick="decideReq(\''+r.id+'\',false)">Reject</button></td></tr>';
        }).join('');
        el('atable').innerHTML = '<table class="resp"><thead><tr><th>Kind</th><th>Requested</th><th>By</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
      });
    }
    window.decideReq = function(id, approve, vendorRequest){
      var body={approve:approve};
      if(approve&&vendorRequest){ var inp=el('reqname_'+id); body.name=inp?inp.value.trim():''; }
      api('/api/expenses/requests/'+id+'/decide', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
        .then(function(d){
          if(!d.success){ setMsg(d.error||'Could not decide.', false); return; }
          loadConfig().then(function(){ syncApprovalsTab(); loadApprovals(); });
        });
    };
    // Show/update the approver/admin Approvals tab (with a pending-count badge).
    function syncApprovalsTab(){
      if(!cfg.isAdmin) return;
      var existing = el('tabs').querySelector('[data-t="approvals"]');
      var label = 'Approvals'+(cfg.pendingCount ? ' ('+cfg.pendingCount+')' : '');
      if(existing){ existing.textContent = label; return; }
      var b = document.createElement('button');
      b.dataset.t = 'approvals'; b.textContent = label;
      el('tabs').appendChild(b);
    }

    // boot
    loadConfig().then(function(){
      selectedNature=(cfg.natures&&cfg.natures[0])||'SANKI';
      if(cfg.isAdmin){el('pendingTab').style.display='';el('receivablesTab').style.display='';el('spendingTab').style.display='';}
      if(!cfg.isAdmin){ // every non-Owner/Admin user: log + view own list only
        var cashBtn = el('tabs').querySelector('[data-t="cash"]');
        if(cashBtn) cashBtn.remove();
        var vendorsBtn = el('tabs').querySelector('[data-t="vendors"]');
        if(vendorsBtn) vendorsBtn.remove();
        var reimburseBtn = el('tabs').querySelector('[data-t="reimbursements"]');
        if(reimburseBtn) reimburseBtn.remove();
      }
      syncApprovalsTab();
      // Optional deep links can open a particular expense or the approvals queue.
      var qs = new URLSearchParams(location.search);
      var f = qs.get('focus'), tp = qs.get('tab');
      if(f){ tab = 'list'; focusId = f; focusedExpenseId = f; }
      else if(tp && el('tabs').querySelector('[data-t="'+tp+'"]')){ tab = tp; }
      Array.prototype.forEach.call(el('tabs').children, function(b){ b.classList.toggle('on', b.dataset.t===tab); });
      render();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
