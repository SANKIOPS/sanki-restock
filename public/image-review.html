<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Image Review · SANKI Business OS</title><link rel="stylesheet" href="/image-review.css?v=20261123-paired-viewer"></head>
<body><main>
<header><div><p class="eyebrow">INVENTORY</p><h1>Image Review</h1><p>Check the website gallery. Keep what is correct. Add original photos for what needs fixing.</p></div><div class="header-actions"><a href="/api/image-review/export">Export review</a><button id="sync">Refresh Shopify images</button></div></header>
<section class="filters" aria-label="Filter catalogue"><label>Collection<select id="collection"><option value="">All collections</option></select></label><label>Gender<select id="gender"><option value="">All genders</option></select></label><label>Category<select id="category"><option value="">All categories</option></select></label><label>Review status<select id="status"><option value="">All statuses</option><option value="unreviewed">Not reviewed</option><option value="correct">Images correct</option><option value="awaiting_originals">Awaiting originals</option><option value="ready_for_correction">Ready for correction</option><option value="queued">Queued</option><option value="processing">Creating images</option><option value="ready">Ready to review</option><option value="published">Published</option><option value="publish_failed">Publishing needs retry</option><option value="website_changed">Website changed</option></select></label><label class="search-label">Find product<input id="search" type="search" placeholder="SKU, title or colour" autocomplete="off"></label></section>
<div class="review-summary" id="summary"></div><p id="message" class="message" role="status">Loading Shopify galleries…</p>
<section id="products" class="products" aria-label="Products"></section>
<footer><button id="previous" disabled>Previous</button><span id="page"></span><button id="next" disabled>Next</button></footer>
</main>
<dialog id="reviewDialog"><div class="dialog-header"><div><p class="eyebrow">PRODUCT COLOUR REVIEW</p><h2 id="reviewTitle"></h2><p id="reviewMeta"></p></div><button id="closeReview" aria-label="Close product review">Close</button></div><div id="reviewBody"></div></dialog>
<dialog id="imageDialog" aria-label="Garment image viewer"><div class="zoom-toolbar"><button id="zoomOut" aria-label="Zoom out">−</button><output id="zoomLevel" aria-live="polite">100%</output><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomFit">Fit whole product</button><span id="viewerCaption" aria-live="polite"></span><button id="closeImage" aria-label="Close enlarged image">Close</button></div><div class="viewer-navigation"><button id="imagePrevious" aria-label="Previous photo">← Previous</button><span>Swipe left/right at Fit · pinch to zoom · drag when zoomed</span><button id="imageNext" aria-label="Next photo">Next →</button></div><div id="viewerPair"><div id="viewerOriginalPane" hidden><small>Your original</small><div id="originalStage" tabindex="0" aria-label="Zoomable original photo"><img id="viewerOriginalImage" alt="Your original garment photo" draggable="false"></div></div><div id="viewerResultPane"><small id="viewerResultLabel">AI result</small><div id="zoomStage" tabindex="0" aria-label="Zoomable garment image"><img id="enlargedImage" alt="Enlarged garment reference" draggable="false"></div></div></div><label id="viewerRevision" hidden>Changes to this photo<textarea id="viewerFeedback" rows="2" placeholder="Describe the change to this photo"></textarea><small>Saved to this photo’s comment. Close the viewer and choose Revise images to submit.</small></label></dialog>
<script src="/sidebar.js"></script><script src="/image-review.js?v=20261123-paired-viewer"></script></body></html>
