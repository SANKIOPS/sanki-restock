<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Image Review · SANKI Business OS</title><link rel="stylesheet" href="/image-review.css"></head>
<body><main>
<header><div><p class="eyebrow">INVENTORY</p><h1>Image Review</h1><p>Check the website gallery. Keep what is correct. Add original photos for what needs fixing.</p></div><div class="header-actions"><a href="/api/image-review/export">Export review</a><button id="sync">Refresh Shopify images</button></div></header>
<section class="filters" aria-label="Filter catalogue"><label>Collection<select id="collection"><option value="">All collections</option></select></label><label>Gender<select id="gender"><option value="">All genders</option></select></label><label>Category<select id="category"><option value="">All categories</option></select></label><label>Review status<select id="status"><option value="">All statuses</option><option value="unreviewed">Not reviewed</option><option value="correct">Images correct</option><option value="awaiting_originals">Awaiting originals</option><option value="ready_for_correction">Ready for correction</option><option value="awaiting_approval">Awaiting approval</option><option value="approved_for_upload">Approved for upload</option><option value="website_changed">Website changed</option></select></label><label class="search-label">Find product<input id="search" type="search" placeholder="SKU, title or colour" autocomplete="off"></label></section>
<div class="review-summary" id="summary"></div><p id="message" class="message" role="status">Loading Shopify galleries…</p>
<section id="products" class="products" aria-label="Products"></section>
<footer><button id="previous" disabled>Previous</button><span id="page"></span><button id="next" disabled>Next</button></footer>
</main>
<dialog id="reviewDialog"><div class="dialog-header"><div><p class="eyebrow">PRODUCT COLOUR REVIEW</p><h2 id="reviewTitle"></h2><p id="reviewMeta"></p></div><button id="closeReview" aria-label="Close product review">Close</button></div><div id="reviewBody"></div></dialog>
<dialog id="imageDialog"><button id="closeImage" aria-label="Close enlarged image">Close</button><img id="enlargedImage" alt="Enlarged garment reference"></dialog>
<script src="/sidebar.js"></script><script src="/image-review.js"></script></body></html>
