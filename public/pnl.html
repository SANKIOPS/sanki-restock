<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><title>P&L · SANKI</title>
  <link rel="stylesheet" href="/pnl.css?v=20261008-collapsed-heads">
</head>
<body>
<main class="wrap">
  <header><div><h1>Profit & loss</h1><p class="muted">SANKI · Completed sales, SKU costs and paid operating expenses</p></div><a class="button" href="/expenses.html">Open ledgers</a></header>
  <form id="filters" class="panel filters">
    <label>Business<select disabled aria-label="Business"><option>SANKI</option></select></label>
    <label>From<input id="from" name="from" type="date" min="2026-08-22" required></label>
    <label>To<input id="to" name="to" type="date" min="2026-08-22" required></label>
    <label>Channel<select id="channel" name="channel"><option>All</option><option>POS</option><option>Website</option><option>Other</option></select></label>
    <button class="primary" type="submit">View report</button>
    <div class="quick"><button type="button" data-period="today">Today</button><button type="button" data-period="month">This month</button><button type="button" data-period="last">Last month</button><button type="button" data-period="start">Since 22 August</button></div>
  </form>
  <div class="toolbar"><p id="rangeNote" class="muted"></p><div><button id="export" disabled>Export Excel</button><button id="print" disabled>Print / Save PDF</button></div></div>
  <p id="status" role="status" aria-live="polite">Loading report…</p>
  <section id="warnings" class="warning panel" hidden></section>
  <section id="cards" class="cards" aria-label="P&L summary"></section>
  <nav class="tabs" aria-label="Report views">
    <button type="button" data-tab="statement" aria-pressed="true">P&L report</button>
    <button type="button" data-tab="tax" aria-pressed="false">Tax & deductions</button>
    <button type="button" data-tab="collections" aria-pressed="false">Collections & COD</button>
    <button type="button" data-tab="trends" aria-pressed="false">Monthly trends</button>
    <button type="button" data-tab="policy" aria-pressed="false">Rules & sources</button>
  </nav>
  <section id="statement" class="panel view"></section>
  <section id="tax" class="panel view" hidden></section>
  <section id="collections" class="panel view" hidden></section>
  <section id="trends" class="panel view" hidden></section>
  <section id="policy" class="panel view" hidden></section>
  <p class="muted footnote">Management report: SKU COGS is recognised when sold, even if the supplier is unpaid. Other expenses use approved payments only. No April figures are used.</p>
</main>
<dialog id="details" aria-labelledby="detailTitle"><header><h2 id="detailTitle">Transactions</h2><button id="closeDetails" aria-label="Close transaction details">Close</button></header><div id="detailBody"></div></dialog>
<script src="/sidebar.js"></script><script src="/pnl.js?v=20261008-collapsed-heads"></script>
</body></html>
