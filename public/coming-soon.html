<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Coming soon · SANKI Business OS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#f6f7f9; color:#1a1a1a;
      display:flex; align-items:center; justify-content:center;
    }
    .panel { text-align:center; padding:40px 28px; max-width:460px; }
    .emoji { font-size:52px; line-height:1; }
    h1 { font-size:24px; margin:16px 0 6px; font-weight:800; }
    .mod { color:#185FA5; }
    p  { color:#6b7280; font-size:14px; margin:0 0 4px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="emoji">&#128679;</div>
    <h1><span class="mod" id="mod-name">This module</span> is coming soon</h1>
    <p>Your access is set up — this department is still being built.</p>
    <p>You'll see it here the moment it goes live.</p>
  </div>
  <script src="/sidebar.js"></script>
  <script>
    // The role's landing page passes ?m=<Module Name> so the message is specific.
    try {
      var m = new URLSearchParams(location.search).get('m');
      if (m) document.getElementById('mod-name').textContent = m;
    } catch (e) {}
  </script>
</body>
</html>
