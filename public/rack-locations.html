<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Search &amp; Rack Locations — SANKI Business OS</title>
<style>
  :root { --accent:#185FA5; --ink:#1a1a1a; --muted:#666; --line:rgba(0,0,0,.1); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         background:#f6f7f9; color:var(--ink); }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 22px 60px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .bar input[type=text]{ flex:1; min-width:220px; padding:11px 13px; border:1px solid var(--line);
        border-radius:9px; font-size:14px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted);
        background:#fff; border:1px solid var(--line); border-radius:20px; padding:7px 12px; cursor:pointer; }
  .chip input { accent-color:var(--accent); }
  button { font:inherit; cursor:pointer; border:none; border-radius:9px; }
  .btn { background:var(--accent); color:#fff; padding:11px 16px; font-weight:600; font-size:14px; }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .photo-actions { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  .photo-btn { background:#fff; color:#6b2f91; border:1px solid #9b59b6; padding:9px 13px; font-weight:600; }
  .photo-results { display:grid; gap:8px; margin:0 0 16px; }
  .photo-card { display:flex; align-items:center; gap:11px; padding:10px; background:#fff; border:1px solid var(--line); border-radius:10px; cursor:pointer; }
  .photo-card:hover { border-color:#9b59b6; background:#fcf8ff; }
  .photo-copy { flex:1; min-width:0; }
  .photo-copy b,.photo-copy span { display:block; }
  .photo-copy span { color:var(--muted); font-size:12px; margin-top:2px; }
  .confidence { font-weight:700; color:#6b2f91; white-space:nowrap; }
  .camera { display:none; position:fixed; inset:0; background:rgba(0,0,0,.86); z-index:1000; align-items:center; justify-content:center; flex-direction:column; padding:20px; }
  .camera video { max-width:100%; max-height:68vh; border-radius:12px; background:#000; }
  .camera-actions { display:flex; gap:10px; margin-top:14px; }
  .camera-error { color:#fff; margin-top:10px; max-width:440px; text-align:center; }
  .meta { font-size:12px; color:var(--muted); margin:2px 0 14px; }
  .meta .stale { color:#b45309; font-weight:600; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line);
        border-radius:12px; overflow:hidden; }
  th,td { text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { background:#fafafa; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#888; }
  tr:last-child td { border-bottom:none; }
  .thumb { width:38px; height:38px; border-radius:7px; object-fit:cover; background:#eee; }
  .qty.zero { color:#b91c1c; font-weight:600; }
  .qty.ok { color:#15803d; font-weight:600; }
  .sku { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#444; }
  .rack-in { width:110px; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
        font-family:ui-monospace,Menlo,monospace; font-size:13px; text-transform:uppercase; }
  .rack-in.saved { border-color:#15803d; background:#f0fdf4; }
  .rack-in.saving { opacity:.6; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .spin { display:inline-block; width:15px; height:15px; border:2px solid rgba(0,0,0,.15);
        border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 Stock Search &amp; Rack Locations</h1>
  <p class="sub">Search by SKU or product details, or upload/take a garment photo. See live stock and the exact rack location.</p>

  <div class="photo-actions">
    <button class="photo-btn" id="cameraBtn" type="button">📷 Take Photo</button>
    <button class="photo-btn" id="uploadBtn" type="button">🖼️ Upload Image</button>
    <input id="photoFile" type="file" accept="image/*" hidden>
  </div>
  <div class="photo-results" id="photoResults"></div>

  <div class="bar">
    <input id="q" type="text" placeholder="Search SKU, product, size, vendor, tag, rack…" autocomplete="off">
    <label class="chip"><input type="checkbox" id="inStock"> In stock only</label>
    <label class="chip"><input type="checkbox" id="hasRack"> Has rack</label>
    <label class="chip"><input type="checkbox" id="noRack"> No rack</label>
    <button class="btn ghost" id="refreshBtn" title="Re-crawl the Shopify catalog">↻ Refresh catalog</button>
    <button class="btn ghost" id="risBtn" title="Pull rack layout from the RIS Google Sheet">⤓ Sync RIS sheet</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="meta" id="risMeta"></div>

  <table>
    <thead><tr>
      <th></th><th>Product</th><th>Size / Variant</th><th>SKU</th><th>Qty</th><th>Rack</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="empty">Type to search your catalog…</td></tr></tbody>
  </table>
</div>

<div class="camera" id="cameraModal">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="camera-actions">
    <button class="btn" id="captureBtn" type="button">📸 Capture</button>
    <button class="btn ghost" id="closeCameraBtn" type="button">Cancel</button>
  </div>
  <div class="camera-error" id="cameraError"></div>
</div>

<script src="/sidebar.js"></script>
<script>
(function () {
  var qEl = document.getElementById('q');
  var inStockEl = document.getElementById('inStock');
  var hasRackEl = document.getElementById('hasRack');
  var noRackEl = document.getElementById('noRack');
  var rowsEl = document.getElementById('rows');
  var metaEl = document.getElementById('meta');
  var refreshBtn = document.getElementById('refreshBtn');
  var risBtn = document.getElementById('risBtn');
  var risMetaEl = document.getElementById('risMeta');
  var photoFileEl = document.getElementById('photoFile');
  var photoResultsEl = document.getElementById('photoResults');
  var cameraModalEl = document.getElementById('cameraModal');
  var cameraVideoEl = document.getElementById('cameraVideo');
  var cameraErrorEl = document.getElementById('cameraError');
  var timer = null, seq = 0;
  var cameraStream = null;

  function resizePhoto(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read this image.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('Could not decode this image.')); };
        img.onload = function () {
          var scale = Math.min(1, 1024 / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', .85).split(',')[1]);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function showPhotoMatches(matches) {
    photoResultsEl.textContent = '';
    if (!matches.length) { photoResultsEl.textContent = 'No close catalog match found. Try a clearer photo of the full garment.'; return; }
    matches.forEach(function (match) {
      var product = match.product || {};
      var variants = product.variants || [];
      var sku = (variants.find(function (v) { return v.sku; }) || {}).sku || '';
      var card = document.createElement('button'); card.type = 'button'; card.className = 'photo-card';
      if (product.image) { var img = document.createElement('img'); img.className = 'thumb'; img.src = product.image; img.alt = ''; card.appendChild(img); }
      var copy = document.createElement('span'); copy.className = 'photo-copy';
      var name = document.createElement('b'); name.textContent = product.name || 'Catalog match'; copy.appendChild(name);
      var detail = document.createElement('span'); detail.textContent = [sku, match.reason].filter(Boolean).join(' · '); copy.appendChild(detail); card.appendChild(copy);
      var confidence = document.createElement('span'); confidence.className = 'confidence'; confidence.textContent = (parseInt(match.confidence, 10) || 0) + '%'; card.appendChild(confidence);
      card.addEventListener('click', function () { qEl.value = sku || product.name || ''; search(); window.scrollTo({ top: qEl.offsetTop - 20, behavior: 'smooth' }); });
      photoResultsEl.appendChild(card);
    });
  }

  function identifyBase64(base64) {
    photoResultsEl.innerHTML = '<span class="spin"></span> Matching this photo with the Shopify catalog…';
    return fetch('/api/identify-product', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ image:base64, mediaType:'image/jpeg' }) })
      .then(function (r) { return r.json().then(function (j) { return { ok:r.ok, data:j }; }); })
      .then(function (out) { if (!out.ok || !out.data.success) throw new Error(out.data.error || 'Identification failed.'); showPhotoMatches(out.data.matches || []); })
      .catch(function (err) { photoResultsEl.textContent = 'Photo search failed: ' + err.message; });
  }

  function closeCamera() {
    if (cameraStream) { cameraStream.getTracks().forEach(function (track) { track.stop(); }); cameraStream = null; }
    cameraVideoEl.srcObject = null; cameraModalEl.style.display = 'none';
  }

  document.getElementById('uploadBtn').addEventListener('click', function () { photoFileEl.click(); });
  photoFileEl.addEventListener('change', function () { var file = photoFileEl.files[0]; photoFileEl.value = ''; if (file) resizePhoto(file).then(identifyBase64).catch(function (e) { photoResultsEl.textContent = e.message; }); });
  document.getElementById('cameraBtn').addEventListener('click', function () {
    cameraErrorEl.textContent = ''; cameraModalEl.style.display = 'flex';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cameraErrorEl.textContent = 'Camera is not available. Use Upload Image instead.'; return; }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false }).then(function (stream) { cameraStream = stream; cameraVideoEl.srcObject = stream; }).catch(function () { cameraErrorEl.textContent = 'Camera permission was denied. Use Upload Image or allow camera access.'; });
  });
  document.getElementById('closeCameraBtn').addEventListener('click', closeCamera);
  document.getElementById('captureBtn').addEventListener('click', function () {
    if (!cameraVideoEl.videoWidth) return;
    var scale = Math.min(1, 1024 / Math.max(cameraVideoEl.videoWidth, cameraVideoEl.videoHeight));
    var canvas = document.createElement('canvas'); canvas.width = Math.round(cameraVideoEl.videoWidth * scale); canvas.height = Math.round(cameraVideoEl.videoHeight * scale);
    canvas.getContext('2d').drawImage(cameraVideoEl, 0, 0, canvas.width, canvas.height);
    var base64 = canvas.toDataURL('image/jpeg', .85).split(',')[1]; closeCamera(); identifyBase64(base64);
  });

  function fmtAgo(ts) {
    if (!ts) return 'never';
    var s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    return Math.round(s / 3600) + 'h ago';
  }

  function setEmpty(msg) {
    rowsEl.textContent = '';
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.colSpan = 6; td.className = 'empty'; td.textContent = msg;
    tr.appendChild(td); rowsEl.appendChild(tr);
  }

  function saveRack(input, variantId, sku) {
    var code = input.value.trim();
    input.classList.remove('saved'); input.classList.add('saving');
    fetch('/api/racks/set', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ variantId: variantId, sku: sku, rack: code })
    }).then(function (r) { return r.json(); }).then(function (j) {
      input.classList.remove('saving');
      if (j && j.success) { input.classList.add('saved'); setTimeout(function () { input.classList.remove('saved'); }, 1500); }
      else { input.style.borderColor = '#b91c1c'; }
    }).catch(function () { input.classList.remove('saving'); input.style.borderColor = '#b91c1c'; });
  }

  function render(data) {
    var rows = (data && data.rows) || [];
    if (!rows.length) { setEmpty('No matches.'); return; }
    rowsEl.textContent = '';
    rows.forEach(function (r) {
      var tr = document.createElement('tr');

      var tdImg = document.createElement('td');
      if (r.image) { var im = document.createElement('img'); im.className = 'thumb'; im.src = r.image; im.loading = 'lazy'; tdImg.appendChild(im); }
      else { var ph = document.createElement('div'); ph.className = 'thumb'; tdImg.appendChild(ph); }
      tr.appendChild(tdImg);

      var tdName = document.createElement('td'); tdName.textContent = r.productTitle || '(untitled)'; tr.appendChild(tdName);
      var tdVar = document.createElement('td'); tdVar.textContent = r.variantTitle || '—'; tr.appendChild(tdVar);

      var tdSku = document.createElement('td'); tdSku.className = 'sku'; tdSku.textContent = r.sku || '—'; tr.appendChild(tdSku);

      var tdQty = document.createElement('td');
      var q = (typeof r.inventoryQuantity === 'number') ? r.inventoryQuantity : null;
      tdQty.className = 'qty ' + (q === null ? '' : (q > 0 ? 'ok' : 'zero'));
      tdQty.textContent = (q === null ? '—' : q);
      tr.appendChild(tdQty);

      var tdRack = document.createElement('td');
      var input = document.createElement('input');
      input.className = 'rack-in'; input.type = 'text'; input.placeholder = '—';
      input.value = r.rack || ''; input.maxLength = 24;
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
      input.addEventListener('blur', function () { saveRack(input, r.variantId, r.sku); });
      tdRack.appendChild(input);
      if (r.rackSource === 'ris') {
        var tag = document.createElement('span');
        tag.textContent = 'RIS'; tag.title = 'From the RIS sheet — edit + blur to override manually';
        tag.style.cssText = 'margin-left:6px;font-size:10px;font-weight:700;color:#185FA5;background:#eef2ff;padding:1px 6px;border-radius:20px;vertical-align:middle;';
        tdRack.appendChild(tag);
      }
      tr.appendChild(tdRack);

      rowsEl.appendChild(tr);
    });
  }

  function search() {
    var mySeq = ++seq;
    var params = new URLSearchParams();
    if (qEl.value.trim()) params.set('q', qEl.value.trim());
    if (inStockEl.checked) params.set('inStock', 'true');
    if (hasRackEl.checked) params.set('hasRack', 'true');
    else if (noRackEl.checked) params.set('hasRack', 'false');
    metaEl.innerHTML = '<span class="spin"></span> Searching…';
    fetch('/api/stock-search?' + params.toString())
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (mySeq !== seq) return;  // a newer search superseded this one
        if (!j || !j.success) { setEmpty('Search failed: ' + ((j && j.error) || 'unknown')); metaEl.textContent = ''; return; }
        var m = 'Showing ' + j.returned + ' of ' + j.total + ' · catalog cached ' + fmtAgo(j.cachedAt);
        metaEl.textContent = m + (j.stale ? '' : '');
        if (j.stale) { metaEl.textContent = m; var s = document.createElement('span'); s.className = 'stale'; s.textContent = '  (stale — click Refresh)'; metaEl.appendChild(s); }
        render(j);
      })
      .catch(function () { if (mySeq === seq) { setEmpty('Network error.'); metaEl.textContent = ''; } });
  }

  function debounced() { clearTimeout(timer); timer = setTimeout(search, 250); }

  qEl.addEventListener('input', debounced);
  inStockEl.addEventListener('change', search);
  hasRackEl.addEventListener('change', function () { if (hasRackEl.checked) noRackEl.checked = false; search(); });
  noRackEl.addEventListener('change', function () { if (noRackEl.checked) hasRackEl.checked = false; search(); });

  refreshBtn.addEventListener('click', function () {
    refreshBtn.disabled = true; var old = refreshBtn.textContent; refreshBtn.textContent = 'Refreshing…';
    fetch('/api/stock-search/refresh').then(function (r) { return r.json(); }).then(function (j) {
      refreshBtn.disabled = false; refreshBtn.textContent = old;
      if (j && j.success) search();
      else alert('Refresh failed: ' + ((j && j.error) || 'unknown'));
    }).catch(function () { refreshBtn.disabled = false; refreshBtn.textContent = old; alert('Refresh failed (network).'); });
  });

  function loadRisStatus() {
    fetch('/api/racks/ris/status').then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.success) return;
      risMetaEl.textContent = j.count
        ? ('RIS: ' + j.count + ' SKUs mapped · last synced ' + fmtAgo(j.syncedAt))
        : 'RIS: not yet synced — click “Sync RIS sheet” to import your rack layout.';
    }).catch(function () {});
  }

  risBtn.addEventListener('click', function () {
    risBtn.disabled = true; var old = risBtn.textContent; risBtn.textContent = 'Syncing…';
    fetch('/api/racks/ris/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        risBtn.disabled = false; risBtn.textContent = old;
        if (j && j.success) {
          risMetaEl.textContent = 'RIS: imported ' + j.imported + ' SKUs (' + j.matchedToCatalog + ' matched to live catalog) · just now';
          search();
        } else {
          risMetaEl.textContent = 'RIS sync failed: ' + ((j && j.error) || 'unknown');
        }
      })
      .catch(function () { risBtn.disabled = false; risBtn.textContent = old; risMetaEl.textContent = 'RIS sync failed (network).'; });
  });

  // Initial load — show what's in the catalog straight away.
  search();
  loadRisStatus();
})();
</script>
</body>
</html>
