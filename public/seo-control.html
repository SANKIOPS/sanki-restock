<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SEO Control Centre · SANKI Business OS</title><link rel="stylesheet" href="/seo-control.css"></head><body><main><header><div><p class="eyebrow">SANKI · OWNER ONLY</p><h1>SEO Control Centre</h1><p class="muted">One operating view for SEO, AEO, GEO and local visibility.</p></div><button id="refresh">Refresh</button></header><section class="hero"><div><p class="label">PLAYBOOK COMPLETION</p><strong id="progress">—</strong><div class="bar"><i id="bar"></i></div></div><p id="focus">Loading the next required action…</p></section><section class="stats" id="stats"></section><nav class="filters" aria-label="Task filters"><button data-filter="action" class="active">Needs action</button><button data-filter="overdue">Overdue</button><button data-filter="today">Due today</button><button data-filter="In progress">In progress</button><button data-filter="Waiting">Waiting</button><button data-filter="all">All 55</button></nav><div class="controls"><input id="search" type="search" placeholder="Search tasks, phases or owners"><select id="phase"><option value="">All phases</option></select></div><p id="message" role="status"></p><section id="tasks" class="tasks"></section><section class="tomorrow"><h2>Tomorrow preview</h2><div id="tomorrow"></div></section></main><dialog id="editor"><form id="form"><header><div><p class="eyebrow" id="editPhase"></p><h2 id="editTitle"></h2></div><button type="button" data-close aria-label="Close">×</button></header><div class="two"><label>Status<select name="status"><option>Not started</option><option>In progress</option><option>Waiting</option><option>Completed</option></select></label><label>Owner<select name="owner"><option>Codex</option><option>Gagan</option><option>Joint</option></select></label></div><label>Due date<input name="dueDate" type="date"></label><label>Next action<textarea name="nextAction" maxlength="1000"></textarea></label><label>Evidence / live URL / result<textarea name="evidence" maxlength="3000" placeholder="Required before completion"></textarea></label><p class="muted">Completed tasks must include evidence, so the record stays trustworthy.</p><p class="error" id="error"></p><button class="primary" type="submit">Save task</button></form></dialog><script src="/sidebar.js"></script><script src="/seo-control.js"></script></body></html>
