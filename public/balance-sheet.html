<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Balance Sheet · SANKI Business OS</title><link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><meta name="theme-color" content="#0F5132"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px}h1{margin:0 0 4px;font-size:34px}.sub,.muted{color:#6b7280}.toolbar,.grid,.stats{display:flex;gap:12px;flex-wrap:wrap}.toolbar{margin:22px 0}.fld{display:grid;gap:5px}.fld label{font-size:12px;font-weight:800;text-transform:uppercase;color:#667085}.fld select,.fld input,button{border:1px solid #d7dce5;border-radius:10px;background:white;padding:11px 13px;font-size:15px}button{background:#1763aa;color:white;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0}.stat,.card{background:white;border:1px solid #e0e4ea;border-radius:14px;padding:18px}.stat b{font-size:28px;display:block;margin-top:7px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #edf0f4}.row:last-child{border:0}.total{font-weight:900;font-size:18px}.warn{margin-top:16px;padding:13px;border-radius:10px;background:#fff7df;color:#7a5700}.links{margin-top:20px;display:flex;gap:14px}.links a{color:#1763aa;font-weight:700}@media(max-width:700px){.stats,.cols{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><main class="wrap"><h1>Balance Sheet</h1><div class="sub">Recorded financial position as of a selected date.</div><div class="links"><a href="/accounting.html">Accounting</a><a href="/expenses.html">Expenses & ledgers</a><a href="/dashboard.html">Dashboard</a></div><div class="toolbar"><div class="fld"><label>Entity</label><select id="nature"><option value="">All accessible entities</option></select></div><div class="fld"><label>As of</label><input type="date" id="asOf"></div><div class="fld"><label>&nbsp;</label><button id="go">Show position</button></div></div><div id="host" class="muted">Loading…</div></main><script src="/sidebar.js"></script><script>
const $=id=>document.getElementById(id),fmt=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('asOf').value=new Date().toISOString().slice(0,10);async function api(u){const r=await fetch(u,{credentials:'same-origin'});return r.json()}function rows(items){return items.length?items.map(x=>'<div class="row"><span>'+esc(x.nature)+' · '+esc(x.name)+'</span><b>'+fmt(x.balance)+'</b></div>').join(''):'<div class="muted">No recorded balance.</div>'}async function load(){const q='?asOf='+$('asOf').value+'&nature='+encodeURIComponent($('nature').value),d=await api('/api/expenses/balance-sheet'+q);if(!d.success){$('host').textContent=d.error||'Could not load.';return}$('host').innerHTML='<div class="stats"><div class="stat"><span>Assets</span><b>'+fmt(d.assets.total)+'</b></div><div class="stat"><span>Liabilities</span><b>'+fmt(d.liabilities.total)+'</b></div><div class="stat"><span>Recorded net position</span><b>'+fmt(d.equity.recordedNetPosition)+'</b></div></div><div class="cols"><section class="card"><h2>Assets</h2>'+rows(d.assets.accounts)+'<div class="row"><span>Receivables</span><b>'+fmt(d.assets.receivables)+'</b></div><div class="row total"><span>Total recorded assets</span><b>'+fmt(d.assets.total)+'</b></div></section><section class="card"><h2>Liabilities</h2><div class="row"><span>Bank overdrafts</span><b>'+fmt(d.liabilities.overdrafts)+'</b></div><div class="row"><span>Vendor payables</span><b>'+fmt(d.liabilities.vendorPayables)+'</b></div><div class="row"><span>Advanced-purchase payables</span><b>'+fmt(d.liabilities.procurementPayables)+'</b></div><div class="row"><span>Reimbursements due</span><b>'+fmt(d.liabilities.reimbursements)+'</b></div><div class="row total"><span>Total recorded liabilities</span><b>'+fmt(d.liabilities.total)+'</b></div></section></div><div class="warn">'+esc(d.note)+'</div>'}api('/api/expenses/config').then(c=>{(c.approvalNatures||[]).forEach(n=>$('nature').insertAdjacentHTML('beforeend','<option>'+esc(n)+'</option>'));load()});$('go').onclick=load;
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}</script></body></html>
